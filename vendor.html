<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7 Brew Punch Walk Vendor Portal</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Anton";font-weight:400;font-display:swap;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: one centered column; task cards stack; sticky footer holds the response action */
:root{
  --bg:#F3F6FA; --surface:#ffffff; --surface-2:#F2F6FA; --ink:#101010; --muted:#55606C; --line:#D9E1EA; --energy-red:#E4002B; --kindness-blue:#81C1EA;
  --accent:#0056B4; --accent-ink:#ffffff; --accent-soft:#E3F1FB; --ok:#1E8449; --ok-soft:#DFF3E6; --bad:#E4002B; --bad-soft:#FDE3E8;
  --font-display:"Anton","Impact","Arial Narrow",sans-serif; --font-sub:"Archivo","Arial Black",Arial,sans-serif; --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B0D10; --surface:#15181D; --surface-2:#1B1F25; --ink:#F2F4F7; --muted:#9AA6B3; --line:#2A3038;
  --accent:#2F7DE0; --accent-ink:#ffffff; --accent-soft:#122B47; --ok:#4cc27a; --ok-soft:#163a25; --bad:#FF3B5C; --bad-soft:#47201a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:900px;margin:0 auto;flex-wrap:wrap;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.logo{width:36px;height:36px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:14px;color:var(--muted)} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
label.f{display:flex;flex-direction:column;gap:6px}
label.f span{font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.err{color:var(--bad);font-weight:600;font-size:14px}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface-2);padding:6px 14px;font-weight:600;font-size:14px}
.rfilter{display:flex;flex-direction:column;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.task{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.task.updated{border-left-color:var(--accent)} .task.done{border-left-color:var(--ok)}
@media (max-width:720px){.task{grid-template-columns:1fr}}
.orig{display:flex;flex-direction:column;gap:8px;min-width:0}
.orig .txt{font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta span{background:var(--surface-2);border-radius:6px;padding:2px 8px}
.cpmnote{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .view{position:absolute;inset:0;border:0;background:none;padding:0}
.thumb .rm{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:7px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.mine{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.mine.dragover{outline:3px dashed var(--accent)}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.frow{display:flex;gap:8px;align-items:center}
.frow input[type=search]{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer}
.fbtn svg{width:19px;height:19px}.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbar{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--accent)}
.fbar .ftext{flex:1;min-width:0;font-weight:600;font-size:14px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbar button{flex:none;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px;cursor:pointer}
.sheetback{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.fsheet{background:var(--surface);width:100%;max-width:720px;max-height:88vh;max-height:88dvh;border-radius:18px 18px 0 0;padding:16px 16px 0;display:flex;flex-direction:column}
@media (min-width:760px){.sheetback{align-items:center}.fsheet{border-radius:18px}}
.fsheet .fhead{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px}
.fsheet .fhead h2{margin:0}
.fsheet .fbody{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding:4px 0 16px}
.fsheet .fgroup .eyebrow{margin-bottom:8px}
.fsheet .ffoot{display:grid;grid-template-columns:1fr 2fr;gap:8px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sechead{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);margin:12px 0 0;display:flex;align-items:baseline;justify-content:space-between;border-left:5px solid var(--energy-red);padding-left:10px}
.sechead span{font-size:14px;color:var(--muted);font-family:var(--font-mono,monospace)}
.cam{position:fixed;inset:0;z-index:58;background:#000;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.cam-view{position:relative;flex:1;min-height:0}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.cam-flash.on{opacity:.75;transition:none}
.cam-count{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:16px;font-weight:600;font-size:15px;white-space:nowrap}
.cam-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;min-height:74px;background:#000}
.cam-strip .t{position:relative;flex:none;width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid #fff}
.cam-strip img{width:100%;height:100%;object-fit:cover;display:block}
.cam-strip button{position:absolute;top:0;right:0;width:24px;height:24px;border:0;border-radius:0 0 0 8px;background:rgba(0,0,0,.7);color:#fff;font-size:16px;line-height:1;padding:0}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:#000}
.cam-bar button{color:#fff;background:none;border:0;font-weight:700;font-size:17px;min-height:48px}
.cam-bar #camCancel{justify-self:start}
.cam-bar .done{justify-self:end;background:#4fa8d8;color:#06131c;border-radius:10px;padding:0 16px}
.cam-bar .done:disabled{opacity:.4}
.cam-bar .shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px #000 inset,0 0 0 4px #fff}
.cam-bar .shutter:active{transform:scale(.92)}
.photobtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photobtns .btn{justify-content:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.tools{grid-template-columns:1fr}}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.foot .in{max-width:900px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.drafts .d{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
code.copy{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}

/* 7 Brew brand layer */
h1,h2,h3,header.top .t{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.015em}
h2{color:var(--accent)}
.eyebrow,label.f span,th,.links .lbl{font-family:var(--font-sub);font-stretch:125%;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
header.top{background:#ffffff;border-bottom:1px solid #D9E1EA;color:#101010}
.brandlogo{height:40px;width:auto;display:block}
.arrows{display:inline-block;height:.62em;width:auto;color:var(--energy-red);vertical-align:middle;margin-left:8px}
.btn{border-radius:14px}
</style>
</head>
<body>
<header class="top"><div class="in"><img class="brandlogo" src="brand/logo-horizontal.png" alt="7 Brew Drive Thru Coffee"><div style="min-width:0"><h1 style="color:var(--accent)">Vendor Portal</h1><div class="note" style="color:#55606C">Add completion photos and notes for your punch list tasks</div></div></div></header>
<main class="wrap" id="app"></main>
<div class="foot" id="foot" hidden><div class="in"><div id="footText" class="note"></div><button class="btn primary" id="makeResp">Create response file</button></div></div>
<div id="overlay"></div>
<div id="camRoot"></div>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const normStand = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');
const STATUS = { open:'Not complete', '':'Not checked', complete:'Complete', na:'N/A' };
let toastT;
function toast(m, ms){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms || 3000); }

/* crypto: must match the Punch Walk app */
const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encJSON(obj, pass, format){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 200000;
  const key = await deriveKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { format, v:1, kdf:'PBKDF2-SHA256', iter, cipher:'AES-256-GCM', salt:b64(salt), iv:b64(iv), data:b64(ct) };
}
async function decJSON(enc, pass){
  const key = await deriveKey(pass, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* drafts saved in this browser so a vendor can come back later */
const store = {
  db:null,
  async open(){ try{ this.db = await new Promise((res, rej) => { const r = indexedDB.open('punch-walk-vendor', 1); r.onupgradeneeded = () => r.result.createObjectStore('drafts'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }catch(e){ this.db = null; } },
  tx(mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction('drafts', mode); const q = fn(t.objectStore('drafts')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); },
  async get(k){ if(!this.db) return null; try{ return await this.tx('readonly', s => s.get(k)); }catch(e){ return null; } },
  async put(k, v){ if(!this.db) return; try{ await this.tx('readwrite', s => s.put(v, k)); }catch(e){ toast('Could not save your progress in this browser.'); } },
  async del(k){ if(!this.db) return; try{ await this.tx('readwrite', s => s.delete(k)); }catch(e){} },
  async all(){ if(!this.db) return []; try{ return await this.tx('readonly', s => s.getAll()); }catch(e){ return []; } }
};

const S = { enc:null, pkg:null, draft:null, filter:'all', resp:[] };
const respOf = i => i.resp || 'Unassigned';
let saveT;
function saveDraft(){ clearTimeout(saveT); saveT = setTimeout(() => { if(S.draft){ S.draft.saved = Date.now(); store.put(S.draft.packageId, S.draft); } }, 400); }

/* ---------- screens ---------- */
async function startScreen(err){
  $('#foot').hidden = true;
  const drafts = (await store.all()).sort((a, b) => b.saved - a.saved);
  app.innerHTML = `<div class="stack">
    <div class="panel stack">
      <h2>Open your task file</h2>
      <div class="note">The project manager emailed you a task file (a .json file). Save it to this computer or phone, then open it here. Your password is the stand number. If a teammate sent you a team progress file, open that here instead to see their work.</div>
      <div class="drop" id="drop">
        <strong>Drag the task file here</strong><span class="note">or</span>
        <label class="btn primary filebtn">Choose task file<input type="file" id="pkgFile" accept=".json,application/json"></label>
      </div>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
    </div>
    ${drafts.length ? `<div class="panel stack drafts"><h3>Continue where you left off</h3>${drafts.map(d => `<div class="d"><div><strong>${esc(d.label || 'Task file')}</strong><div class="note">Last saved ${esc(new Date(d.saved).toLocaleString())} · ${Object.keys(d.updates || {}).length} task${Object.keys(d.updates || {}).length === 1 ? '' : 's'} updated</div></div><div class="chips"><button class="btn" data-resume="${esc(d.packageId)}">Continue</button><button class="btn" data-forget="${esc(d.packageId)}">Remove</button></div></div>`).join('')}</div>` : ''}
    <div class="note">Your photos and notes stay in this browser until you create the response file and email it back. Nothing is uploaded to a server.</div>
  </div>`;
  const drop = $('#drop');
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files && e.dataTransfer.files[0]; if(f) readPkg(f); });
  $('#pkgFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if(f) readPkg(f); });
  app.querySelectorAll('[data-resume]').forEach(b => b.addEventListener('click', async () => { const d = await store.get(b.dataset.resume); if(d){ S.enc = d.enc; S.resume = d; passScreen(); } }));
  app.querySelectorAll('[data-forget]').forEach(b => b.addEventListener('click', async () => {
    if(b.dataset.armed){ await store.del(b.dataset.forget); startScreen(); } else { b.dataset.armed = '1'; b.textContent = 'Remove saved work?'; }
  }));
}
async function readPkg(file){
  let enc;
  try{ enc = JSON.parse(await file.text()); }catch(e){ return startScreen('That file could not be read. Choose the task file from your email.'); }
  if(enc && enc.format === 'punch-walk-vendor-progress'){ S.enc = null; S.progEnc = enc; S.resume = null; return passScreen(); }
  S.progEnc = null;
  if(!enc || enc.format !== 'punch-walk-vendor-tasks') return startScreen(enc && enc.format === 'punch-walk-vendor-response' ? 'That is a response file. Open the task file you received instead.' : 'That is not a Punch Walk task file.');
  S.enc = enc; S.resume = null; passScreen();
}
function passScreen(err){
  app.innerHTML = `<div class="panel stack" style="max-width:520px">
    <h2>Enter the password</h2>
    <div class="note">The password is the stand number for this project, for example CIPM0169.</div>
    <form id="passForm" class="stack" autocomplete="off">
      <label class="f"><span>Stand number</span><input type="password" id="pass" autocapitalize="characters" autocorrect="off" spellcheck="false" required></label>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button class="btn primary" type="submit">Open tasks</button>
      <button class="btn" type="button" id="back">Choose a different file</button>
    </form></div>`;
  $('#pass').focus();
  $('#back').addEventListener('click', () => startScreen());
  $('#passForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Checking…';
    let prog = null;
    try{
      const pass = normStand($('#pass').value);
      if(S.progEnc){ prog = await decJSON(S.progEnc, pass); S.enc = prog.pkgEnc; }
      S.pkg = await decJSON(S.enc, pass);
      S.pass = pass;

      for(const { d, items } of older){

        if(!defs){ try{ defs = (await decJSON(d.enc, S.pass)).items || []; }catch(e){ defs = []; } }

        for(const [k, u] of Object.entries(d.updates || {})){

async function openBurstCamera(onDone){
  const root = $('#camRoot');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('This browser cannot open the camera here. Use Choose photos instead.'); return; }
  const constraints = { audio:false, video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1440 } } };
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia(constraints); }
  catch(e){
    toast(e && e.name === 'NotAllowedError' ? 'Camera access is blocked. Allow camera access for this app in Settings, or use Choose photos.' : 'Could not start the camera. Use Choose photos instead.');
    return;
  }
  const shots = []; let armedCancel = false;
  root.innerHTML = `<div class="cam" role="dialog" aria-label="Camera">
    <div class="cam-view"><video id="camV" playsinline muted autoplay></video><div class="cam-flash" id="camFlash"></div>
      <div class="cam-count" id="camCount">Tap the shutter for each photo</div></div>
    <div class="cam-strip" id="camStrip"></div>
    <div class="cam-bar">
      <button data-c="cancel" id="camCancel">Cancel</button>
      <button class="shutter" data-c="shoot" aria-label="Take photo"></button>
      <button data-c="done" class="done" id="camDone" disabled>Done</button>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  const video = $('#camV');
  const attach = async st => { stream = st; video.srcObject = st; try{ await video.play(); }catch(_){} };
  await attach(stream);
  const stop = () => {
    try{ stream.getTracks().forEach(t => t.stop()); }catch(_){}
    document.removeEventListener('visibilitychange', onVis);
    root.innerHTML = ''; root.onclick = null; document.body.style.overflow = '';
  };
  const onVis = async () => {
    if(document.visibilityState !== 'visible' || !root.firstChild) return;
    if(stream.getVideoTracks().every(t => t.readyState === 'ended')){
      try{ await attach(await navigator.mediaDevices.getUserMedia(constraints)); }catch(_){ toast('The camera stopped. Tap Done to keep your photos.'); }
    }
  };
  document.addEventListener('visibilitychange', onVis);
  const refresh = () => {
    $('#camCount').textContent = shots.length ? `${shots.length} photo${shots.length > 1 ? 's' : ''}` : 'Tap the shutter for each photo';
    const done = $('#camDone'); done.disabled = !shots.length; done.textContent = shots.length ? `Done (${shots.length})` : 'Done';
    $('#camStrip').innerHTML = shots.map((sh, i) => `<div class="t"><img src="${sh.src}" alt="Photo ${i + 1}"><button data-c="rm" data-i="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join('');
    const strip = $('#camStrip'); strip.scrollLeft = strip.scrollWidth;
    armedCancel = false; $('#camCancel').textContent = 'Cancel';
  };
  const shoot = () => {
    const vw = video.videoWidth, vh = video.videoHeight; if(!vw || !vh) return;
    const sc = Math.min(1, 1280 / Math.max(vw, vh));
    const w = Math.round(vw * sc), h = Math.round(vh * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(video, 0, 0, w, h);
    shots.push({ src: cv.toDataURL('image/jpeg', 0.8), w, h, taken: Date.now() });
    const fl = $('#camFlash'); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 60);
    try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
    refresh();
  };
  root.onclick = e => {
    const b = e.target.closest('[data-c]'); if(!b || b.disabled) return;
    const c = b.dataset.c;
    if(c === 'shoot') shoot();
    else if(c === 'rm'){ shots.splice(Number(b.dataset.i), 1); refresh(); }
    else if(c === 'done'){ const out = shots.slice(); stop(); onDone(out); }
    else if(c === 'cancel'){
      if(shots.length && !armedCancel){ armedCancel = true; b.textContent = `Discard ${shots.length}?`; return; }
      stop();
    }
  };
  refresh();
}

async function addPhotos(id, files){
  files = files.filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!files.length) return;
  toast(`Adding ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  const u = upd(id);
  for(const f of files){
    const url = URL.createObjectURL(f);
    try{
      const im = await loadImage(url);
      const sc = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
      u.photos.push({ id:uid(), src:cv.toDataURL('image/jpeg', 0.8), w, h });
    }catch(e){ toast(`${f.name} could not be read. Use JPEG or PNG photos.`); }
    finally{ URL.revokeObjectURL(url); }
  }
  saveDraft(); updateCard(id);
}
app.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.add){ const files = [...(t.files || [])]; t.value = ''; addPhotos(t.dataset.add, files); }
  else if(t.dataset.done){ upd(t.dataset.done).done = t.checked; saveDraft(); updateCard(t.dataset.done); }
});
app.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.notes){ upd(t.dataset.notes).notes = t.value; saveDraft(); refreshSummary(); const c = document.getElementById('t-' + t.dataset.notes); if(c) c.classList.toggle('updated', !!hasUpd(S.draft.updates[t.dataset.notes])); }
});
app.addEventListener('click', e => {
  const cb = e.target.closest('[data-cam]');
  if(cb){ const id = cb.dataset.cam; openBurstCamera(shots => { if(!shots.length) return; const u = upd(id); shots.forEach(sh => u.photos.push({ id:uid(), src:sh.src, w:sh.w, h:sh.h })); saveDraft(); updateCard(id); toast(`Added ${shots.length} photo${shots.length > 1 ? 's' : ''}`); }); return; }
  const rm = e.target.closest('[data-rm]');
  if(rm){ const [id, k] = rm.dataset.rm.split(':'); upd(id).photos.splice(Number(k), 1); saveDraft(); updateCard(id); return; }
  const vw = e.target.closest('[data-view]');
  if(vw){
    const [id, kind, k] = vw.dataset.view.split(':');
    const src = kind === 'o' ? S.pkg.items.find(i => i.id === id).photos[k] : upd(id).photos[k].src;
    const ov = $('#overlay'); ov.innerHTML = `<div class="lightbox" role="dialog" aria-label="Photo"><img src="${src}" alt="Photo"></div>`;
    ov.firstChild.addEventListener('click', () => { ov.innerHTML = ''; });
  }
});

/* ---------- response file ---------- */
$('#makeResp').addEventListener('click', async () => {
  const btn = $('#makeResp'); btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const items = S.pkg.items.filter(i => hasUpd(S.draft.updates[i.id])).map(i => {
      const u = S.draft.updates[i.id];
      return { id:i.id, done:!!u.done, notes:(u.notes || '').trim(), photos:u.photos.map(p => ({ id:p.id, src:p.src, w:p.w, h:p.h })) };
    });
    const resp = { subId:uid(), packageId:S.pkg.packageId, walkId:S.pkg.walkId, stand:S.pkg.stand, vendor:S.draft.vendor, submitted:Date.now(), items };
    const enc = await encJSON(resp, S.pass, 'punch-walk-vendor-response');
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '-').trim();
    const name = `Punch response - ${safe(S.pkg.stand)} - ${safe(S.draft.vendor.company || S.draft.vendor.name)} - ${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([JSON.stringify(enc)], { type:'application/json' });
    showDone(name, blob, items.length);
  }catch(err){ toast('Could not create the response file.'); }
  finally{ btn.disabled = false; btn.textContent = 'Create response file'; }
});
function showDone(name, blob, n){
  const p = S.pkg, mb = blob.size / 1048576;
  const file = new File([blob], name, { type:'application/json' });
  let canShare = false; try{ canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })); }catch(e){}
  const subject = `Punch list response – ${p.stand}`;
  const body = `Attached is my punch list response for ${p.stand}${p.address ? ' – ' + p.address : ''} (${n} task${n === 1 ? '' : 's'} updated).\n\n${S.draft.vendor.name}${S.draft.vendor.company ? '\n' + S.draft.vendor.company : ''}\n${S.draft.vendor.email}`;
  const mailto = `mailto:${encodeURIComponent(p.cpm.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const ov = $('#overlay');
  ov.innerHTML = `<div class="lightbox" style="background:rgba(0,0,0,.55)"><div class="panel stack" role="dialog" aria-label="Response file ready" style="max-width:560px;width:100%">
    <h2>Response file ready</h2>
    <div><strong style="overflow-wrap:anywhere">${esc(name)}</strong> <span class="note mono">${mb >= 1 ? mb.toFixed(1) + ' MB' : Math.max(1, Math.round(blob.size / 1024)) + ' KB'}</span></div>
    ${mb > 20 ? '<div class="err">This file is larger than most email services allow (about 20 MB). Remove some photos, or send the tasks in two responses.</div>' : ''}
    <ol class="note" style="margin:0;padding-left:20px"><li>Save the file.</li><li>Email it to ${esc(p.cpm.name || 'the project manager')}${p.cpm.email ? ` at <code class="copy">${esc(p.cpm.email)}</code>` : ''} as an attachment.</li></ol>
    <button class="btn primary block" id="dlBtn">Save response file</button>
    ${canShare ? '<button class="btn block" id="shBtn">Share (email from this phone)</button>' : ''}
    <a class="btn block" href="${mailto}" style="text-decoration:none">Start the email</a>
    <div class="note">Your work stays saved in this browser, so you can add more and send another response later.</div>
    <button class="btn block" id="closeBtn">Close</button>
  </div></div>`;
  $('#dlBtn').addEventListener('click', () => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Saved'); });
  if(canShare) $('#shBtn').addEventListener('click', async () => { try{ await navigator.share({ files:[file] }); }catch(e){ if(e && e.name !== 'AbortError') toast('Sharing failed. Save the file instead.'); } });
  $('#closeBtn').addEventListener('click', () => { ov.innerHTML = ''; });
}

/* ---------- team progress file: hand your work to someone else on your team ---------- */
const safeN = s => String(s || '').replace(/[\\/:*?"<>|]+/g, '-').trim();
function offerFile(name, blob, title, lines){
  const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
  let canShare = false; try{ canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })); }catch(e){}
  const mb = blob.size / 1048576;
  const ov = $('#overlay');
  ov.innerHTML = `<div class="lightbox" style="background:rgba(0,0,0,.55)"><div class="panel stack" role="dialog" aria-label="${esc(title)}" style="max-width:560px;width:100%">
    <h2>${esc(title)}</h2>
    <div><strong style="overflow-wrap:anywhere">${esc(name)}</strong> <span class="note mono">${mb >= 1 ? mb.toFixed(1) + ' MB' : Math.max(1, Math.round(blob.size / 1024)) + ' KB'}</span></div>
    ${mb > 20 ? '<div class="err">This file is larger than most email services allow (about 20 MB). Share it through Dropbox, OneDrive or a similar service.</div>' : ''}
    <div class="note">${lines}</div>
    <button class="btn primary block" id="ofSave">Save file</button>
    ${canShare ? '<button class="btn block" id="ofShare">Share</button>' : ''}
    <button class="btn block" id="ofClose">Close</button>
  </div></div>`;
  $('#ofSave').addEventListener('click', () => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Saved'); });
  if(canShare) $('#ofShare').addEventListener('click', async () => { try{ await navigator.share({ files:[file] }); }catch(e){ if(e && e.name !== 'AbortError') toast('Sharing failed. Save the file instead.'); } });
  $('#ofClose').addEventListener('click', () => { ov.innerHTML = ''; });
}
async function makeTeamFile(btn){
  btn.disabled = true;
  try{
    const prog = { packageId:S.pkg.packageId, pkgEnc:S.draft.enc, vendor:S.draft.vendor, updates:S.draft.updates, extraItems:S.draft.extraItems || [], series:S.draft.series || '', shared:Date.now(), from:S.draft.vendor.name || '' };
    const enc = await encJSON(prog, S.pass, 'punch-walk-vendor-progress');
    const name = `Punch progress - ${safeN(S.pkg.stand)} - ${safeN(S.draft.vendor.company || S.draft.vendor.name)} - ${new Date().toISOString().slice(0, 10)}.json`;
    offerFile(name, new Blob([JSON.stringify(enc)], { type:'application/json' }), 'Team progress file ready',
      `Send this file to someone on your team. They open <strong>${esc(location.href.split('#')[0])}</strong>, choose this file instead of the task file, and enter the stand number. They will see every photo, note and completed task so far, and can keep working or create the response file. This is not the response file for the project manager.`);
  }catch(e){ toast('Could not create the team progress file.'); }
  finally{ btn.disabled = false; }
}

/* ---------- completion report PDF ---------- */
function pdfSheet(){
  const ov = $('#overlay');
  const parties = [...new Set(S.pkg.items.map(respOf))].sort();
  let pick = (S.resp || []).slice();
  ov.innerHTML = `<div class="lightbox" style="background:rgba(0,0,0,.55)"><div class="panel stack" role="dialog" aria-label="Completion report" style="max-width:560px;width:100%;max-height:90vh;overflow:auto">
    <h2>Completion report (PDF)</h2>
    <div class="note">A PDF of your work that anyone can open: each task with your notes, photos and completion status.</div>
    <label class="check"><input type="radio" name="pscope" value="upd" checked> Updated tasks only</label>
    <label class="check"><input type="radio" name="pscope" value="all"> All tasks</label>
    ${parties.length > 1 ? `<div><div class="eyebrow" id="pRespLbl" style="margin-bottom:8px">Responsible party${pick.length ? ` · ${pick.length} selected` : ''}</div><div class="chips" id="pResp">${['', ...parties].map(p => `<button class="chip" data-p="${esc(p)}" aria-pressed="${p === '' ? !pick.length : pick.includes(p)}">${esc(p || 'All')}${p ? ` <span class="mono">${S.pkg.items.filter(i => respOf(i) === p).length}</span>` : ''}</button>`).join('')}</div></div>` : ''}
    <label class="check"><input type="checkbox" id="pPm" checked> Include the project manager's notes and photos</label>
    <button class="btn primary block" id="pGo">Build PDF</button>
    <button class="btn block" id="pClose">Close</button>
  </div></div>`;
  $('#pClose').addEventListener('click', () => { ov.innerHTML = ''; });
  ov.querySelectorAll('#pResp [data-p]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.p; pick = v === '' ? [] : (pick.includes(v) ? pick.filter(x => x !== v) : pick.concat(v));
    ov.querySelectorAll('#pResp [data-p]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.p === '' ? !pick.length : pick.includes(x.dataset.p))));
    $('#pRespLbl').textContent = pick.length ? `Responsible party · ${pick.length} selected` : 'Responsible party';
  }));
  $('#pGo').addEventListener('click', async e => { const all = ov.querySelector('[name=pscope]:checked').value === 'all', pm = $('#pPm').checked; e.target.disabled = true; e.target.textContent = 'Building…'; await makeCompletionPDF(all, pm, pick); });
}
async function imgInfo(src){ const im = await loadImage(src); return { w:im.naturalWidth, h:im.naturalHeight }; }
async function makeCompletionPDF(all, withPm, resps){
  resps = resps || [];
  if(!window.jspdf){ toast('The PDF builder did not load. Reopen this page with signal.'); return; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'letter' });
    const W = 612, H = 792, M = 44, CW = W - 2*M;
    const blue = [0,86,180], ink = [16,16,16], muted = [85,96,108], green = [31,122,63], line = [217,225,234];
    const p = S.pkg, v = S.draft.vendor;
    let y = M;
    const need = h => { if(y + h > H - M - 14){ doc.addPage(); y = M; } };
    const text = (t, size, o = {}) => {
      doc.setFont('helvetica', o.bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(o.color || ink));
      const lines = doc.splitTextToSize(String(t), o.width || CW); need(lines.length * size * 1.3);
      doc.text(lines, o.x || M, y + size); y += lines.length * size * 1.3 + (o.after || 0);
    };
    try{
      const bl = await fetch('brand/logo-horizontal.png').then(r => r.blob());
      const src = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(bl); });
      const d = await imgInfo(src); const lh = 34; doc.addImage(src, 'PNG', W - M - lh * d.w / d.h, y - 4, lh * d.w / d.h, lh, undefined, 'FAST');
    }catch(e){}
    text('PUNCH LIST COMPLETION REPORT', 10, { bold:true, color: blue, after: 2 });
    text(`Stand ${p.stand}`, 22, { bold:true, after: 0 });
    if(p.address) text(p.address, 11, { color: muted, after: 8 });
    const items = p.items.filter(i => (all || hasUpd(S.draft.updates[i.id])) && (!resps.length || resps.includes(respOf(i))));
    const done = items.filter(i => (S.draft.updates[i.id] || {}).done).length;
    const phs = items.reduce((a, i) => a + ((S.draft.updates[i.id] || {}).photos || []).length, 0);
    [['Completed by', `${v.name || ''}${v.company ? ', ' + v.company : ''}${v.email ? ' · ' + v.email : ''}`], ['Report date', new Date().toLocaleString()], ['Punch walk', `${p.date || ''}${p.cpm && p.cpm.name ? ' · ' + p.cpm.name : ''}`], ['Responsible party', resps.length ? resps.join(', ') : 'All'], ['Summary', `${items.length} task${items.length === 1 ? '' : 's'} · ${done} marked complete · ${phs} photo${phs === 1 ? '' : 's'}`]]
      .forEach(([k, val]) => { doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...muted); doc.text(k.toUpperCase(), M, y + 10); doc.setFont('helvetica', 'normal'); doc.setTextColor(...ink); doc.text(doc.splitTextToSize(val, CW - 110)[0], M + 110, y + 10); y += 15; });
    y += 6; doc.setDrawColor(...blue); doc.setLineWidth(2); doc.line(M, y, W - M, y); y += 12;
    if(!items.length) text('No tasks have been updated yet.', 11, { color: muted });
    const photoRow = async (srcs, label) => {
      if(!srcs.length) return;
      text(label, 8.5, { bold:true, color: muted, after: 3 });
      const colW = (CW - 10) / 2, maxH = 170;
      for(let k = 0; k < srcs.length; k += 2){
        const pair = [];
        for(const s of srcs.slice(k, k + 2)){ const d = s.w && s.h ? s : Object.assign({ src:s.src }, await imgInfo(s.src)); const sc = Math.min(colW / d.w, maxH / d.h); pair.push({ src:d.src, w:d.w * sc, h:d.h * sc }); }
        const rh = Math.max(...pair.map(q => q.h)); need(rh + 8);
        pair.forEach((q, j) => { try{ doc.addImage(q.src, 'JPEG', M + j * (colW + 10), y, q.w, q.h, undefined, 'FAST'); }catch(e){} });
        y += rh + 8;
      }
    };
    for(const i of items){
      const u = S.draft.updates[i.id] || { notes:'', done:false, photos:[] };
      need(70);
      doc.setFillColor(...(u.done ? green : hasUpd(u) ? blue : line)); doc.rect(M, y, 4, 34, 'F');
      text(`#${i.no || '—'}  ${i.item}`, 11.5, { bold:true, x: M + 12, width: CW - 12, after: 1 });
      text(`${i.location || ''} · ${i.resp || 'Unassigned'} · ${u.done ? 'Marked complete' : hasUpd(u) ? 'Updated, not marked complete' : 'Not updated'}`, 9, { x: M + 12, width: CW - 12, color: u.done ? green : muted, after: 5 });
      if(withPm && i.notes) text('Project manager: ' + i.notes, 9.5, { x: M + 12, width: CW - 12, color: muted, after: 3 });
      if(withPm) await photoRow((i.photos || []).map(src => ({ src })), "PROJECT MANAGER'S PHOTOS");
      if((u.notes || '').trim()) text('Notes: ' + u.notes.trim(), 10, { x: M + 12, width: CW - 12, after: 4 });
      await photoRow(u.photos || [], 'COMPLETION PHOTOS');
      y += 4; doc.setDrawColor(...line); doc.setLineWidth(0.6); need(10); doc.line(M, y, W - M, y); y += 12;
    }
    const n = doc.getNumberOfPages();
    for(let k = 1; k <= n; k++){ doc.setPage(k); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...muted); doc.text(`Stand ${p.stand} · Completion report · ${v.company || v.name || ''} · Page ${k} of ${n}`, W / 2, H - 22, { align:'center' }); }
    const name = `Completion report - ${safeN(p.stand)} - ${safeN(v.company || v.name)}${resps.length ? ' - ' + safeN(resps.join(', ')).slice(0, 40) : ''} - ${new Date().toISOString().slice(0, 10)}.pdf`;
    offerFile(name, doc.output('blob'), 'Completion report ready', 'Save or share this PDF. Anyone can open it. To send your work to the project manager for review, still use <strong>Create response file</strong>.');
  }catch(e){ toast('Could not build the PDF.'); const g = $('#pGo'); if(g){ g.disabled = false; g.textContent = 'Build PDF'; } }
}

store.open().then(() => startScreen());
})();
</script>
