<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7 Brew Punch Walk</title>
<meta name="description" content="Field punch walks for 7 Brew stand hand-overs">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punch Walk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Anton";font-weight:400;font-display:swap;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* 7 Brew brand system (Brand Book 2026). Stand Blue leads, Energy Red signals attention, Kindness Blue softens.
   Anton ~ Acumin Pro Extra Condensed UltraBlack (headlines), Archivo Expanded ~ Acumin Pro Extra Wide Black (subheads), Montserrat ~ Gotham (body). */
:root{
  --stand-blue:#0056B4; --energy-red:#E4002B; --kindness-blue:#81C1EA; --rich-black:#101010;
  --bg:#F3F6FA; --surface:#ffffff; --surface-2:#F2F6FA; --ink:#101010; --muted:#55606C; --line:#D9E1EA;
  --header:#ffffff; --hero:#0056B4; --hero-ink:#ffffff;
  --accent:#0056B4; --accent-ink:#ffffff; --accent-soft:#E3F1FB; --link:#0056B4;
  --ok:#1E8449; --ok-soft:#DFF3E6; --bad:#E4002B; --bad-soft:#FDE3E8; --na:#6B7682; --na-soft:#E7ECF1;
  --font-display:"Anton","Impact","Arial Narrow",sans-serif;
  --font-sub:"Archivo","Arial Black",Arial,sans-serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D10; --surface:#15181D; --surface-2:#1B1F25; --ink:#F2F4F7; --muted:#9AA6B3; --line:#2A3038;
  --header:#101010; --hero:#0056B4; --hero-ink:#ffffff;
  --accent:#2F7DE0; --accent-ink:#ffffff; --accent-soft:#122B47; --link:#81C1EA;
  --ok:#3FBF72; --ok-soft:#12301E; --bad:#FF3B5C; --bad-soft:#3A1219; --na:#8E99A5; --na-soft:#232931; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D10; --surface:#15181D; --surface-2:#1B1F25; --ink:#F2F4F7; --muted:#9AA6B3; --line:#2A3038;
  --header:#101010; --hero:#0056B4; --hero-ink:#ffffff;
  --accent:#2F7DE0; --accent-ink:#ffffff; --accent-soft:#122B47; --link:#81C1EA;
  --ok:#3FBF72; --ok-soft:#12301E; --bad:#FF3B5C; --bad-soft:#3A1219; --na:#8E99A5; --na-soft:#232931; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:980px;margin:0 auto;padding-bottom:48px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px}
.bar .title{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1;min-width:0}
.bar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600;font-size:15px}
.iconbtn svg{width:20px;height:20px}

/* buttons */
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px}

.section{padding-block:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--bad-soft)}

/* walk list cards */
.walk{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.walk .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.walk .stand{font-family:var(--font-display);font-weight:700;font-size:20px}
.prog{height:8px;border-radius:4px;background:var(--na-soft);overflow:hidden;display:flex;margin-top:10px}
.prog i{display:block;height:100%}
.prog .p-ok{background:var(--ok)} .prog .p-bad{background:var(--bad)} .prog .p-na{background:var(--na)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* walk header */
.whead{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface-2);padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input,.filters select{min-height:42px;padding:8px 10px;font-size:15px}

/* item rows */
.group{padding-block:14px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h3{font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.items{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-left:6px solid var(--line)}
.row.st-complete{border-left-color:var(--ok)}
.row.st-open{border-left-color:var(--bad)}
.row.st-na{border-left-color:var(--na)}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:4px}
.row-main .txt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.row-main .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.row-main .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag svg{width:14px;height:14px}
.seg{display:flex;flex:none;border-left:1px solid var(--line)}
.seg button{width:50px;border:0;border-left:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seg button:first-child{border-left:0}
.seg button svg{width:22px;height:22px}
.seg button.na{font-family:var(--font-display);font-size:15px;letter-spacing:.03em}
.seg button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].bad{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);color:#fff}
@media (max-width:400px){.seg button{width:44px}}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* item detail */
.bigseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigseg button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.bigseg button svg{width:20px;height:20px}
.bigseg button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bigseg button[aria-pressed="true"].bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bigseg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .open{position:absolute;inset:0;border:0;background:none;padding:0}
.ph .badge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;pointer-events:none}
.ph .del{position:absolute;right:6px;top:6px;height:34px;min-width:34px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px;padding:0 8px;display:flex;align-items:center;justify-content:center}
.ph .del.confirm{background:var(--bad)}
.ph .del svg{width:18px;height:18px}
.addph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.itemtext{font-size:20px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ve-overlap{display:inline-block;align-self:flex-start;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px}
.kvsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvsel select{min-width:0;width:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* annotator */
.ann{position:fixed;inset:0;z-index:50;background:#0b0f12;display:flex;flex-direction:column;color:#fff;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ann-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.ann canvas{max-width:100%;max-height:100%;touch-action:none;display:block;border-radius:4px}
.ann-bar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px}
.ann-bar button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid #33414c;background:#18222a;color:#fff;font-weight:600;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ann-bar button svg{width:20px;height:20px}
.ann-bar button[aria-pressed="true"]{background:#e8edf0;color:#0b0f12}
.ann-bar .sw{width:44px;padding:0}
.ann-bar .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid #fff}
.ann-bar .sw[aria-pressed="true"]{background:#33414c;color:#fff;outline:3px solid #e8edf0}
.ann-bar .save{background:#4fa8d8;border-color:#4fa8d8;color:#06131c}
.ann-bar .sep{width:1px;height:28px;background:#33414c;margin:0 2px}
.ann-hint{font-size:13px;color:#94a2ac;text-align:center;padding-top:6px}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .fname{font-weight:600;overflow-wrap:anywhere}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
details.more .stack{padding-top:8px}
.update{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px}
.update button{background:var(--accent-ink);color:var(--accent);border:0;border-radius:8px;min-height:38px;padding:0 12px;font-weight:700}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets .chip{justify-content:center;padding:6px 4px;font-size:13.5px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
details.more summary{justify-content:space-between;gap:10px}
details.more summary .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.checks{display:flex;flex-direction:column;max-height:280px;overflow:auto;padding-top:4px}
.checks .check{min-height:40px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;min-height:40px;padding:0 4px}
.prev{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prev-group{font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:10px 12px 6px;background:var(--surface-2);border-top:1px solid var(--line)}
.prev-group:first-child{border-top:0}
.prev-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.prev-row .no{font-size:12px;color:var(--muted);min-width:34px;padding-top:2px}
.prev-row .meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.prev-row .grow{overflow-wrap:anywhere}
.pill{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.ann-ta{position:fixed;z-index:52;transform-origin:0 0;background:transparent;border:0;outline:none;resize:none;overflow:hidden;font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:16px;line-height:1.18;margin:0;box-sizing:border-box;caret-color:currentColor;-webkit-text-size-adjust:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.sitebtn{min-height:46px;justify-content:flex-start;gap:10px;padding:8px 14px;flex-wrap:wrap}
.sitebtn .muted{font-size:13px;margin-left:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard input{min-height:42px;padding:8px 10px}
.camapp{align-self:center;font-size:14px;min-height:40px;display:inline-flex;align-items:center;position:relative}
.cam{position:fixed;inset:0;z-index:58;background:#000;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.cam-view{position:relative;flex:1;min-height:0}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.cam-flash.on{opacity:.75;transition:none}
.cam-count{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 12px;border-radius:16px;font-weight:600;font-size:15px;white-space:nowrap}
.cam-strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;min-height:74px;background:#000}
.cam-strip .t{position:relative;flex:none;width:58px;height:58px;border-radius:8px;overflow:hidden;border:2px solid #fff}
.cam-strip img{width:100%;height:100%;object-fit:cover;display:block}
.cam-strip button{position:absolute;top:0;right:0;width:24px;height:24px;border:0;border-radius:0 0 0 8px;background:rgba(0,0,0,.7);color:#fff;font-size:16px;line-height:1;padding:0}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));background:#000}
.cam-bar button{color:#fff;background:none;border:0;font-weight:700;font-size:17px;min-height:48px}
.cam-bar #camCancel{justify-self:start}
.cam-bar .done{justify-self:end;background:#4fa8d8;color:#06131c;border-radius:10px;padding:0 16px}
.cam-bar .done:disabled{opacity:.4}
.cam-bar .shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px #000 inset,0 0 0 4px #fff}
.cam-bar .shutter:active{transform:scale(.92)}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtns .sitebtn{justify-content:center;font-size:15px;padding:8px 10px}
.pendn{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:#fff;font-size:13px;line-height:22px;text-align:center}
.vtag{color:var(--accent);font-weight:600}
.warnpanel{border-color:var(--accent);background:var(--accent-soft)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.ventry{border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.vs-b-accepted{border-left-color:var(--ok)} .vs-b-denied{border-left-color:var(--bad)}
.ve-head{line-height:1.3;overflow-wrap:anywhere}
.ve-notes{background:var(--surface);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.ve-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.ve-ph{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:4/3;background:var(--surface)}

<script>
(function(){
"use strict";

/* ---------- icons ---------- */
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h4"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M10 5h9v9"/></svg>',
  circle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><ellipse cx="12" cy="12" rx="8" ry="6.5"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 9l5 5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>',
  arrows:'<svg class="arrows" viewBox="0 0 66 22" aria-hidden="true" fill="currentColor"><path d="M0 0h8l11 11L8 22H0l11-11zM22 0h8l11 11-11 11h-8l11-11zM44 0h8l11 11-11 11h-8l11-11z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>',
  person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.2-3.8 4-5.8 7.5-5.8s6.3 2 7.5 5.8"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>',
  text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11l6 6M15 11l-6 6"/></svg>'
};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = s => { if (!s) return ''; const [y,m,d] = s.split('-').map(Number); if(!y) return s; return new Date(y, m-1, d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
const STATUS = { complete:'Complete', open:'Not complete', na:'N/A', '':'Not checked' };
let toastTimer;
function toast(msg, ms){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, ms || 2600); }

/* ---------- storage (IndexedDB on this device, memory fallback) ---------- */
const DB = {
  db:null, ok:false, mem:{walks:new Map(), photos:new Map(), meta:new Map()},
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('punch-walk', 1);
        r.onupgradeneeded = () => { const d = r.result; ['walks','photos','meta'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.ok = true;
      try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    }catch(e){ this.ok = false; }
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      let req; const t = this.db.transaction(store, mode);
      req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(s,k){ if(!this.ok) return this.mem[s].get(k); try{ return await this.tx(s,'readonly',o=>o.get(k)); }catch(e){ return undefined; } },
  async put(s,k,v){ if(!this.ok){ this.mem[s].set(k,v); return; } try{ await this.tx(s,'readwrite',o=>o.put(v,k)); }catch(e){ toast('Could not save. Phone storage may be full.'); } },
  async del(s,k){ if(!this.ok){ this.mem[s].delete(k); return; } try{ await this.tx(s,'readwrite',o=>o.delete(k)); }catch(e){} },
  async all(s){ if(!this.ok) return [...this.mem[s].values()]; try{ return await this.tx(s,'readonly',o=>o.getAll()); }catch(e){ return []; } }
};

/* ---------- state ---------- */
const S = { view:'home', template:null, needPass:false, passMsg:'', online:navigator.onLine !== false, updateReady:null, walks:[], walk:null, itemId:null, filter:'all', loc:[], resp:[], div:[], q:'', scroll:0, delArm:null };
let saveTimer = null;
function saveWalk(now){
  if(!S.walk) return;
  S.walk.updated = Date.now();
  clearTimeout(saveTimer);
  const w = S.walk;
  if(now) return DB.put('walks', w.id, w);
  saveTimer = setTimeout(() => DB.put('walks', w.id, w), 350);
}
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; if(S.walk) return DB.put('walks', S.walk.id, S.walk); } return Promise.resolve(); }
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flush(); });

/* ---------- template parsing (reads the user's Excel at runtime) ---------- */
const cleanLoc = s => String(s || '').trim().replace(/^\.+/, '').replace(/^z(?=[A-Z])/, '').trim() || 'MISC.';
function limitedRows(ws){
  if(!ws || !ws['!ref']) return [];
  const r = XLSX.utils.decode_range(ws['!ref']);
  r.e.c = Math.min(r.e.c, 30); r.e.r = Math.min(r.e.r, 3000);
  return XLSX.utils.sheet_to_json(ws, {header:1, range:r, defval:null, raw:false, blankrows:false});
}
function parseTemplate(wb, fileName){
  const name = wb.SheetNames.find(n => /punch/i.test(n)) || wb.SheetNames[0];
  const rows = limitedRows(wb.Sheets[name]);
  let h = -1, col = {};
  for(let i = 0; i < Math.min(rows.length, 40); i++){
    const r = (rows[i] || []).map(c => String(c ?? '').trim().toLowerCase());
    if(r.includes('item') && r.some(c => c.startsWith('location'))){
      h = i;
      r.forEach((c, j) => {
        if(c === 'no' || c === 'no.' || c === '#') col.no = j;
        else if(c === 'item') col.item = j;
        else if(c.startsWith('division')) col.div = j;
        else if(c.startsWith('location')) col.loc = j;
        else if(c.startsWith('resp')) col.resp = j;
      });
      break;
    }
  }
  if(h < 0 || col.item == null) throw new Error('Could not find the Item and Location header row in this file.');
  const items = [];
  for(let i = h + 1; i < rows.length; i++){
    const r = rows[i] || [];
    const text = String(r[col.item] ?? '').trim();
    if(!text || /^description$/i.test(text)) continue;
    items.push({
      no: col.no != null ? String(r[col.no] ?? '').trim() : '',
      item: text,
      division: col.div != null ? String(r[col.div] ?? '').trim() : '',
      location: cleanLoc(col.loc != null ? r[col.loc] : ''),
      resp: col.resp != null ? String(r[col.resp] ?? '').trim() : ''
    });
  }
  if(!items.length) throw new Error('No checklist items were found under the header row.');
  const divisions = new Set(items.map(x => x.division).filter(Boolean));
  const resps = new Set(items.map(x => x.resp).filter(Boolean));
  const locations = new Set(items.map(x => x.location));
  const dataName = wb.SheetNames.find(n => /^data$/i.test(n.trim()));
  if(dataName){
    const dr = limitedRows(wb.Sheets[dataName]);
    let hdr = -1, dc = {};
    for(let i = 0; i < Math.min(dr.length, 15); i++){
      const r = (dr[i] || []).map(c => String(c ?? '').trim().toLowerCase());
      if(r.some(c => c.startsWith('division')) && r.some(c => c.startsWith('resp'))){
        hdr = i; r.forEach((c,j) => { if(c.startsWith('division')) dc.div = j; else if(c.startsWith('location')) dc.loc = j; else if(c.startsWith('resp')) dc.resp = j; }); break;
      }
    }
    if(hdr >= 0) for(let i = hdr + 1; i < dr.length; i++){
      const r = dr[i] || [];
      if(dc.div != null && r[dc.div]) divisions.add(String(r[dc.div]).trim());
      if(dc.resp != null && r[dc.resp]) resps.add(String(r[dc.resp]).trim());
      if(dc.loc != null && r[dc.loc]) locations.add(cleanLoc(r[dc.loc]));
    }
  }
  return { fileName, loaded: Date.now(), items, divisions:[...divisions].sort(), resps:[...resps].sort(), locations: orderLocs([...locations]) };
}
function orderLocs(list){
  const first = l => /pre-stand/i.test(l) ? 0 : /^misc/i.test(l) ? 2 : 1;
  return [...new Set(list)].sort((a,b) => first(a) - first(b) || a.localeCompare(b));
}

/* ---------- counts ---------- */
function counts(w){
  const c = { total:w.items.length, complete:0, open:0, na:0, todo:0, photos:0, site:(w.sitePhotos || []).length };
  w.items.forEach(it => { if(it.status === 'complete') c.complete++; else if(it.status === 'open') c.open++; else if(it.status === 'na') c.na++; else c.todo++; c.photos += it.photos.length; });
  return c;
}
function progBar(c){
  const p = n => c.total ? (n / c.total * 100).toFixed(2) + '%' : '0';
  return `<div class="prog" aria-hidden="true"><i class="p-ok" style="width:${p(c.complete)}"></i><i class="p-bad" style="width:${p(c.open)}"></i><i class="p-na" style="width:${p(c.na)}"></i></div>`;
}

/* ---------- views ---------- */
function go(view, opts={}){
  flush();
  if(S.view === 'walk') S.scroll = window.scrollY;
  S.view = view; Object.assign(S, opts); S.delArm = null;
  render();
  if(view === 'walk' && opts.keepScroll) window.scrollTo(0, S.scroll); else if(!opts.keepScroll) window.scrollTo(0, 0);
}
function render(){
  const v = S.view;
  if(v === 'home') return renderHome();
  if(v === 'new') return renderWalkForm(null);
  if(v === 'edit') return renderWalkForm(S.walk);
  if(v === 'walk') return renderWalk();
  if(v === 'item') return renderItem();
  if(v === 'additem') return renderAddItem();
  if(v === 'report') return renderReport();
  if(v === 'gallery') return renderGallery();
  if(v === 'vendors') return renderVendors();
}

function tplPanelHTML(t){
  return `    <div class="panel stack tplpanel">
      <div class="eyebrow">Checklist template</div>

function itemVisible(it){
  if(S.filter !== 'all'){
    if(S.filter === 'todo' && it.status) return false;
    if(S.filter !== 'todo' && S.filter !== 'photos' && it.status !== S.filter) return false;
    if(S.filter === 'photos' && !it.photos.length) return false;
  }
  if(!inScope(it)) return false;
  if(S.q){ const q = S.q.toLowerCase(); if(!(it.item.toLowerCase().includes(q) || String(it.no).includes(q) || (it.notes||'').toLowerCase().includes(q))) return false; }
  return true;
}
function visibleItems(){
  const w = S.walk; const out = [];
  w.locations.forEach(loc => w.items.forEach(it => { if(it.location === loc && itemVisible(it)) out.push(it); }));
  return out;
}

const divOfItem = it => it.division || 'No division';
const respOfItem = it => it.resp || 'Unassigned';
/* Location, responsible party and division filters (status chips and search are separate) */
function inScope(it){
  const L = sel(S.loc), R = sel(S.resp), D = sel(S.div);
  return (!L.length || L.includes(it.location)) && (!R.length || R.includes(respOfItem(it))) && (!D.length || D.includes(divOfItem(it)));
}
// Location, responsible and division filters are lists; an empty list means all
const sel = v => Array.isArray(v) ? v : (!v || v === 'all' ? [] : [v]);
function resetScope(){ S.loc = []; S.resp = []; S.div = []; }
const scopeActive = () => sel(S.loc).length > 0 || sel(S.resp).length > 0 || sel(S.div).length > 0;
const anyFilterActive = () => scopeActive() || S.filter !== 'all' || !!S.q;
const STATUS_LABEL = { todo:'Not checked', open:'Not complete', complete:'Complete', na:'N/A', photos:'With photos' };
function scopeCount(){ return sel(S.loc).length + sel(S.resp).length + sel(S.div).length; }
// Updates the Filter button and the active-filter bar
function updatePills(){
  const btn = $('#fbtn'); if(btn){ const n = scopeCount(); btn.classList.toggle('on', n > 0); btn.querySelector('span').textContent = n ? `Filter (${n})` : 'Filter'; }
  const bar = $('#fbar'); if(!bar) return;
  if(!anyFilterActive()){ bar.innerHTML = ''; return; }
  const parts = [S.resp, S.div, S.loc].map(v => sel(v).join(', ')).filter(Boolean);
  if(S.filter !== 'all') parts.push(STATUS_LABEL[S.filter]);
  if(S.q) parts.push('“' + S.q + '”');
  bar.innerHTML = `<div class="fbar"><div class="ftext">${esc(parts.join(' · '))}</div><button data-act="clearfilters" aria-label="Clear all filters">${I.x}<span>Clear all</span></button></div>`;

function openFilterSheet(){

  const groups = [
    { key:'resp', title:'Responsible party', vals:[...new Set(w.items.map(respOfItem))].sort(), of:respOfItem },
    { key:'div', title:'Division', vals:[...new Set(w.items.map(divOfItem))].sort(), of:divOfItem },
    { key:'loc', title:'Location', vals:w.locations.filter(l => w.items.some(i => i.location === l)), of:it => it.location }
  ];
  const draw = () => {
    const shown = visibleItems().length;
    root.innerHTML = `<div class="sheet-back" data-s="close"><div class="sheet fsheet" role="dialog" aria-modal="true" aria-label="Filter">

      <div class="fbody">${groups.map(g => {
        const cur = sel(S[g.key]);
        const chip = (v, label, n) => `<button class="chip" data-s="pick" data-k="${g.key}" data-v="${esc(v)}" aria-pressed="${v === 'all' ? !cur.length : cur.includes(v)}">${esc(label)}${n != null ? ` <b>${n}</b>` : ''}</button>`;
        return `<div class="fgroup"><div class="eyebrow">${g.title}${cur.length ? ` · ${cur.length} selected` : ''}</div><div class="chips wrap">${chip('all', 'All')}${g.vals.map(v => chip(v, v, w.items.filter(i => g.of(i) === v).length)).join('')}</div></div>`;
      }).join('')}</div>
      <div class="ffoot"><button class="btn" data-s="clear">Clear all</button><button class="btn primary" data-s="close">Show ${shown} item${shown === 1 ? '' : 's'}</button></div>
    </div></div>`;
  };
  const apply = () => { updatePills(); refreshCounts(); renderList(); };
  draw();
  const keepScroll = fn => { const body = root.querySelector('.fbody'); const y = body ? body.scrollTop : 0; fn(); const nb = root.querySelector('.fbody'); if(nb) nb.scrollTop = y; };
  root.onclick = e => {
    const b = e.target.closest('[data-s]'); if(!b) return;
    if(b.classList.contains('sheet-back') && e.target !== b) return;

    else if(a === 'pick'){ const k = b.dataset.k, v = b.dataset.v, cur = sel(S[k]); S[k] = v === 'all' ? [] : (cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v)); apply(); keepScroll(draw); }
    else if(a === 'clear'){ resetScope(); S.filter = 'all'; S.q = ''; const q = $('#q'); if(q) q.value = ''; apply(); keepScroll(draw); }
  };
}

/* ---------- report: filters, sorting, preview ---------- */
const ST_ORDER = { open:0, todo:1, complete:2, na:3 };
const ST_LABEL = { open:'Not complete', todo:'Not checked', complete:'Complete', na:'N/A' };
const ST_TOKEN = { open:'--bad', todo:'--muted', complete:'--ok', na:'--na' };
const SORTS = { location:'Location', number:'Item number', resp:'Responsible party', status:'Status', division:'Division' };
const stKey = it => it.status || 'todo';
const numOf = it => { const n = parseFloat(String(it.no ?? '').replace(/[^0-9.]/g, '')); return isNaN(n) ? Infinity : n; };
const respOf = it => it.resp || 'Unassigned';
const divOf = it => it.division || 'No division';
function defaultRepOpts(){ return { st:{ open:true, todo:true, complete:true, na:true }, resp:[], loc:[], div:[], noFrom:'', noTo:'', photosOnly:false, notesOnly:false, q:'', sort:'location', photos:true, site:true }; }
function repOpts(){
  const w = S.walk, d = defaultRepOpts();
  if(!w.reportOpts || typeof w.reportOpts !== 'object') w.reportOpts = d;
  const o = w.reportOpts;
  Object.keys(d).forEach(k => { if(o[k] === undefined) o[k] = d[k]; });
  o.st = Object.assign(d.st, o.st || {});
  ['resp','loc','div'].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
  if(!SORTS[o.sort]) o.sort = 'location';
  return o;
}
function reportItems(w, o){
  const from = String(o.noFrom).trim() === '' ? null : Number(o.noFrom);
  const to = String(o.noTo).trim() === '' ? null : Number(o.noTo);
  const q = (o.q || '').trim().toLowerCase();
  const list = w.items.filter(it => {
    if(!o.st[stKey(it)]) return false;
    if(o.resp.length && !o.resp.includes(respOf(it))) return false;
    if(o.loc.length && !o.loc.includes(it.location)) return false;
    if(o.div.length && !o.div.includes(divOf(it))) return false;
    const n = numOf(it);
    if(from !== null && !isNaN(from) && !(n >= from)) return false;
    if(to !== null && !isNaN(to) && !(n <= to)) return false;
    if(o.photosOnly && !it.photos.length) return false;
    if(o.notesOnly && !(it.notes || '').trim()) return false;
    if(q && !(`${it.item} ${it.notes || ''} ${it.no}`).toLowerCase().includes(q)) return false;
    return true;
  });
  const li = l => { const i = w.locations.indexOf(l); return i < 0 ? 999 : i; };
  const byNum = (a, b) => { const x = numOf(a), y = numOf(b); return x === y ? 0 : x < y ? -1 : 1; };
  const primary = {
    location: (a, b) => li(a.location) - li(b.location),
    number: () => 0,
    resp: (a, b) => respOf(a).localeCompare(respOf(b)),
    status: (a, b) => ST_ORDER[stKey(a)] - ST_ORDER[stKey(b)],
    division: (a, b) => divOf(a).localeCompare(divOf(b))
  }[o.sort] || (() => 0);
  const idx = new Map(w.items.map((it, i) => [it, i]));
  list.sort((a, b) => primary(a, b) || (o.sort === 'number' ? 0 : li(a.location) - li(b.location)) || byNum(a, b) || (idx.get(a) - idx.get(b)));
  return list;
}
function groupOf(o, it){
  if(o.sort === 'location') return it.location;
  if(o.sort === 'resp') return respOf(it);
  if(o.sort === 'status') return ST_LABEL[stKey(it)];
  if(o.sort === 'division') return divOf(it);
  return null;
}
function describeFilters(o){
  const parts = [];
  const sts = Object.keys(ST_LABEL).filter(k => o.st[k]);
  parts.push(sts.length === 4 ? 'All statuses' : sts.length ? sts.map(k => ST_LABEL[k]).join(', ') : 'No statuses selected');
  if(o.resp.length) parts.push('Responsible: ' + o.resp.join(', '));
  if(o.loc.length) parts.push('Location: ' + o.loc.join(', '));
  if(o.div.length) parts.push('Division: ' + o.div.join(', '));
  const f = String(o.noFrom).trim(), t = String(o.noTo).trim();
  if(f || t) parts.push(`Item # ${f || 'start'} to ${t || 'end'}`);
  if(o.photosOnly) parts.push('With photos');
  if(o.notesOnly) parts.push('With notes');
  if((o.q || '').trim()) parts.push(`Text contains "${o.q.trim()}"`);
  parts.push('Sorted by ' + SORTS[o.sort].toLowerCase());
  return parts.join(' · ');
}

/* ---------- shared file crypto (stand-number lock for vendor files) ---------- */
const normStand = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '');
async function encJSON(obj, pass, format){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 200000;
  const key = await deriveKey(pass, salt, iter);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { format, v:1, kdf:'PBKDF2-SHA256', iter, cipher:'AES-256-GCM', salt:b64(salt), iv:b64(iv), data:b64(ct) };
}
async function decJSON(enc, pass){
  const key = await deriveKey(pass, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function shrinkDataURL(src, max, q){
  const im = await loadImage(src);
  const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(im, 0, 0, w, h);
  return { src: cv.toDataURL('image/jpeg', q), w, h };
}

/* ---------- full walk file: save and open on another device ---------- */
// Full walk file: a .zip with walk.json plus every photo as a real JPEG (about a quarter smaller than text, and phones offer Dropbox/OneDrive for zip files)
const dataURLParts = u => { const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(u || ''); return m ? { mime: m[1] || 'image/jpeg', b64: m[3] } : null; };
const extOf = mime => mime === 'image/png' ? 'png' : mime === 'image/webp' ? 'webp' : 'jpg';
async function exportWalkFile(btn){
  const w = S.walk; if(!w) return;
  if(!window.JSZip){ toast('The zip builder did not load. Reopen the app with signal.'); return; }
  btn.disabled = true; toast('Building the walk file…', 60000);
  try{
    await flush();
    const ids = [...new Set(allPhotoIds(w))];
    const zip = new window.JSZip();
    const meta = [];
    for(const id of ids){
      const p = await DB.get('photos', id); if(!p) continue;
      const m = Object.assign({}, p);
      for(const key of ['src', 'ann']){
        const d = dataURLParts(p[key]);
        if(d){ const name = `photos/${p.id}${key === 'ann' ? '-marked' : ''}.${extOf(d.mime)}`; zip.file(name, d.b64, { base64:true, binary:true }); m[key] = { file:name, mime:d.mime }; }
      }
      meta.push(m);
    }
    w.lastExported = Date.now(); await DB.put('walks', w.id, w);
    zip.file('walk.json', JSON.stringify({ format:'punch-walk-walk', v:2, exported:w.lastExported, walk:w, photos:meta }));
    const blob = await zip.generateAsync({ type:'blob', compression:'STORE', mimeType:'application/zip', streamFiles:true });
    const t = $('.toast'); if(t) t.hidden = true;
    showFileReady(`Punch Walk - ${safeName(w.stand)} - ${w.date} - full walk.zip`, blob,
      'Tap Share, then Save to Files and pick your Dropbox or OneDrive folder (or tap the Dropbox or OneDrive app if it is listed). Open it later on any device with "Open a walk file" on the home screen. Do not unzip it; it holds the whole walk, including every photo.');
  }catch(err){ const t = $('.toast'); if(t) t.hidden = true; toast('Could not build the walk file. Close other apps and try again.', 5000); }
  finally{ btn.disabled = false; }
}
async function readWalkFile(file){
  let data;

    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    if(head[0] === 0x50 && head[1] === 0x4B){
      // Zip walk file: rebuild each photo from its JPEG
      if(!window.JSZip){ toast('The zip reader did not load. Reopen the app with signal.'); return; }
      toast('Opening the walk file…', 60000);
      const zip = await window.JSZip.loadAsync(file);
      const wj = zip.file('walk.json'); if(!wj) throw new Error('no walk.json');
      data = JSON.parse(await wj.async('string'));
      for(const p of (Array.isArray(data.photos) ? data.photos : [])){
        for(const key of ['src', 'ann']){
          const ref = p[key];
          if(ref && typeof ref === 'object' && ref.file){
            const entry = zip.file(ref.file);
            const mime = /^image\/(jpeg|png|webp)$/.test(ref.mime) ? ref.mime : 'image/jpeg';
            p[key] = entry ? `data:${mime};base64,` + await entry.async('base64') : null;
          }
        }
      }
      const t = $('.toast'); if(t) t.hidden = true;
    } else {
      data = JSON.parse(await file.text());
    }
  }catch(e){ const t = $('.toast'); if(t) t.hidden = true; toast('That file is not a Punch Walk walk file. If you unzipped it, open the original .zip file.', 5000); return; }
  if(!data || data.format !== 'punch-walk-walk' || !data.walk || !Array.isArray(data.walk.items)){

async function importWalk(data, asCopy){
  const w = JSON.parse(JSON.stringify(data.walk));
  const photos = Array.isArray(data.photos) ? data.photos : [];
  const map = {};
  if(asCopy){
    w.id = uid(); w.created = Date.now();
    photos.forEach(p => { map[p.id] = 'p' + uid(); });
    const m = id => map[id] || id;
    w.items.forEach(it => { it.photos = (it.photos || []).map(m); });
    w.sitePhotos = (w.sitePhotos || []).map(m);
    (w.vendorSubs || []).forEach(s => s.items.forEach(e => { e.photoIds = (e.photoIds || []).map(m); }));
  } else {
    const old = S.walks.find(x => x.id === w.id);
    if(old){ const keep = new Set(photos.map(p => p.id)); for(const pid of allPhotoIds(old)) if(!keep.has(pid)) await DB.del('photos', pid); }
  }
  for(const p of photos){ const np = Object.assign({}, p, { id: map[p.id] || p.id, walkId: w.id }); await DB.put('photos', np.id, np); }
  w.items.forEach(it => { it.photos = it.photos || []; });
  w.updated = Date.now();
  await DB.put('walks', w.id, w);
  S.pendingImport = null; await loadWalks(); renderHome();
  toast(`Opened ${w.stand || 'walk'} with ${photos.length} photo${photos.length === 1 ? '' : 's'}`);
}

async function buildVendorFile(btn){

      out.push({ id:it.id, no:it.no, item:it.item, location:it.location, division:it.division, resp:it.resp, status:it.status || '', notes:it.notes || '', photos });

async function loadVendorResponse(file){
  const w = S.walk;
  let enc;
  try{ enc = JSON.parse(await file.text()); }catch(e){ toast('That is not a vendor response file.'); return; }
  if(!enc || enc.format !== 'punch-walk-vendor-response'){ toast(enc && enc.format === 'punch-walk-walk' ? 'That is a full walk file. Open it from the home screen.' : 'That is not a vendor response file.'); return; }
  let r;
  try{ r = await decJSON(enc, normStand(w.stand)); }catch(e){ toast(`This response does not belong to ${w.stand || 'this walk'}. Open the walk it was sent for.`); return; }
  if(!r || r.walkId !== w.id){ toast(`This response is for a different walk${r && r.stand ? ' (' + r.stand + ')' : ''}.`); return; }
  w.vendorSubs = w.vendorSubs || [];
  if(w.vendorSubs.some(s => s.id === r.subId)){ toast('This response is already loaded.'); return; }
  const str = (v, n) => String(v == null ? '' : v).slice(0, n);
  const sub = { id:str(r.subId, 80) || uid(), packageId:str(r.packageId, 80), vendor:{ name:str(r.vendor && r.vendor.name, 120), company:str(r.vendor && r.vendor.company, 120), email:str(r.vendor && r.vendor.email, 160) }, submitted:Number(r.submitted) || Date.now(), imported:Date.now(), items:[] };
  let photoCount = 0;
  for(const e of (Array.isArray(r.items) ? r.items : [])){
    if(!w.items.some(i => i.id === e.id)) continue;
    const notes = str(e.notes, 5000).trim(), done = e.done === true;
    const pics = (Array.isArray(e.photos) ? e.photos : []).filter(p => p && typeof p.src === 'string' && p.src.startsWith('data:image/'));
    if(!notes && !done && !pics.length) continue;
    const photoIds = [];
    for(const p of pics){
      const rec = { id:'p' + uid(), src:p.src, ann:null, shapes:[], w:Number(p.w) || 1280, h:Number(p.h) || 960, kind:'vendor', walkId:w.id, itemId:e.id, caption:'', taken:sub.submitted };
      await DB.put('photos', rec.id, rec); photoIds.push(rec.id); photoCount++;
    }
    sub.items.push({ itemId:e.id, done, notes, photoIds, review:{ state:'pending' } });
  }
  if(!sub.items.length){ toast('The response has no updates for this walk.'); return; }
  w.vendorSubs.push(sub); saveWalk(true);
  toast(`Loaded ${sub.items.length} update${sub.items.length === 1 ? '' : 's'} from ${sub.vendor.name || sub.vendor.email || 'the vendor'}`);
  renderVendors();
}

        ${st === 'pending' ? `<div class="ve-actions">

function subEntry(b){ const s = (S.walk.vendorSubs || []).find(x => x.id === b.dataset.sub); return s ? { s, e: s.items[Number(b.dataset.k)] } : {}; }
function reviewEntry(s, e, state, reason){
  const w = S.walk, it = w.items.find(i => i.id === e.itemId); if(!it || !e) return;
  e.review = { state, reason: reason || '', at: Date.now(), prevStatus: it.status || '', prevNotes: it.notes || '', prevFa: !!it.fa };
  if(state === 'accepted'){
    it.status = 'complete';
    e.photoIds.forEach(pid => { if(!it.photos.includes(pid)) it.photos.push(pid); });
    const who = s.vendor.name || s.vendor.email || 'Vendor';
    it.notes = (it.notes ? it.notes + '\n' : '') + `Completed by ${who} (${new Date(s.submitted).toLocaleDateString()})${e.notes ? ': ' + e.notes : ''}`;
  } else if(it.status === 'complete'){
    // Never reopen an item that is already Complete (for example accepted from another vendor's response)
    e.review.keptComplete = true;
  } else {
    it.status = 'open'; it.fa = false;
  }
  e.review.after = itemSnap(it);
  saveWalk(true);
}
const itemSnap = it => JSON.stringify([it.status || '', it.notes || '', !!it.fa, it.photos.length]);
function undoEntry(e){
  const it = S.walk.items.find(i => i.id === e.itemId); if(!it) return false;
  const r = e.review;
  // Block undo when the item changed after this review, so newer work is never overwritten
  if(r.after && r.after !== itemSnap(it)) return false;
  if(r.state === 'accepted') it.photos = it.photos.filter(pid => !e.photoIds.includes(pid));
  it.status = r.prevStatus || ''; it.notes = r.prevNotes || ''; it.fa = !!r.prevFa;
  e.review = { state:'pending' }; saveWalk(true);
  return true;
}
function emailVendor(s){
  const w = S.walk; const lines = [];
  const pick = st => s.items.filter(e => e.review.state === st).map(e => ({ e, it: w.items.find(i => i.id === e.itemId) })).filter(x => x.it);
  const acc = pick('accepted'), den = pick('denied'), pen = pick('pending');
  lines.push(s.vendor.name ? `Hello ${s.vendor.name},` : 'Hello,', '', `I reviewed the punch list updates you sent for ${w.stand}${w.address ? ' – ' + w.address : ''}.`, '');
  if(acc.length){ lines.push('Accepted:'); acc.forEach(({ it }) => lines.push(`- #${it.no} ${it.item}`)); lines.push(''); }
  if(den.length){ lines.push('Not accepted (please correct and resubmit):'); den.forEach(({ e, it }) => lines.push(`- #${it.no} ${it.item}${e.review.reason ? ' – ' + e.review.reason : ''}`)); lines.push(''); }
  if(pen.length){ lines.push('Still under review:'); pen.forEach(({ it }) => lines.push(`- #${it.no} ${it.item}`)); lines.push(''); }
  lines.push('Thank you,', w.by || '');
  const url = `mailto:${encodeURIComponent(s.vendor.email)}?subject=${encodeURIComponent(`Punch list review – ${w.stand}`)}&body=${encodeURIComponent(lines.join('\n'))}`;
  try{ navigator.clipboard && navigator.clipboard.writeText(lines.join('\n')).catch(() => {}); }catch(_){}
  location.href = url;
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === 'home'){ await flush(); S.walk = null; await loadWalks(); go('home'); }
  else if(act === 'new') go('new');
  else if(act === 'openwalk'){ S.walk = S.walks.find(w => w.id === b.dataset.id); S.filter='all'; resetScope(); S.q=''; S.searchOpen=false; S.scroll=0; go('walk'); wake(); }
  else if(act === 'backwalk') go('walk', {keepScroll:true});
  else if(act === 'edit') go('edit');
  else if(act === 'report') go('report');
  else if(act === 'additem') go('additem');
  else if(act === 'filter'){ S.filter = b.dataset.f; refreshCounts(); updatePills(); renderList(); }
  else if(act === 'filtersheet'){ openFilterSheet(); }
  else if(act === 'clearfilters'){ S.filter = 'all'; resetScope(); S.q = ''; const q = $('#q'); if(q) q.value = ''; updatePills(); refreshCounts(); renderList(); window.scrollTo(0, 0); toast('Filters cleared'); }
  else if(act === 'st'){
    const row = b.closest('.row'); const it = setStatus(row.dataset.id, b.dataset.st);
    if(it){ row.outerHTML = rowHTML(it); refreshCounts(); }
  }
  else if(act === 'item'){ S.itemId = b.dataset.id; go('item'); }
  else if(act === 'goitem'){ if(b.dataset.id){ S.itemId = b.dataset.id; go('item'); } }
  else if(act === 'bst'){
    const it = setStatus(S.itemId, b.dataset.st);
    if(it){ document.querySelectorAll('.bigseg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.st === it.status)));
      const fa = $('#i-fa'); fa.disabled = it.status !== 'complete'; fa.checked = !!it.fa; }
  }
  else if(act === 'annotate'){ const p = await DB.get('photos', b.dataset.pid); if(p) openAnnotator(p); }
  else if(act === 'delphoto'){
    const pid = b.dataset.pid; const it = S.walk.items.find(x => x.id === S.itemId);
    if(S.delArm !== pid){ S.delArm = pid; renderPhotos(it); return; }
    it.photos = it.photos.filter(x => x !== pid); S.delArm = null;
    await DB.del('photos', pid); saveWalk(true);
    rerenderItem();
    toast('Photo deleted');
  }
  else if(act === 'delitem'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.querySelector('span').textContent = 'Tap again to remove'; return; }
    const it = S.walk.items.find(x => x.id === S.itemId);
    for(const pid of it.photos) await DB.del('photos', pid);
    S.walk.items = S.walk.items.filter(x => x.id !== S.itemId); saveWalk(true); go('walk',{keepScroll:true}); toast('Item removed');
  }
  else if(act === 'delwalk'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.querySelector('span').textContent = 'Tap again to delete walk and photos'; return; }
    const w = S.walk;
    for(const it of w.items) for(const pid of it.photos) await DB.del('photos', pid);
    for(const pid of (w.sitePhotos || [])) await DB.del('photos', pid);
    for(const sb of (w.vendorSubs || [])) for(const e of sb.items) for(const pid of (e.photoIds || [])) await DB.del('photos', pid);
    await DB.del('walks', w.id); S.walk = null; await loadWalks(); go('home'); toast('Walk deleted');
  }
  else if(act === 'applyupdate'){ await flush(); if(S.updateReady) S.updateReady.postMessage('SKIP_WAITING'); }
  else if(act === 'teamtpl'){
    if(!navigator.onLine){ toast('Connect to signal to load the team checklist.'); return; }
    const pass = await DB.get('meta', 'pass');
    if(pass) await syncTeamTemplate(pass); else { S.needPass = true; S.passMsg = 'Enter the team passcode to switch back to the team checklist.'; renderHome(); }
  }
  else if(act === 'gallery') go('gallery');
  else if(act === 'vendors') go('vendors');
  else if(act === 'exportwalk') exportWalkFile(b);
  else if(act === 'impreplace') importWalk(S.pendingImport.data, false);
  else if(act === 'impcopy') importWalk(S.pendingImport.data, true);
  else if(act === 'impcancel'){ S.pendingImport = null; renderHome(); }
  else if(act === 'vbuild') buildVendorFile(b);
  else if(act === 'vpackage') buildVendorPackage(b);

/* ---------- in-app camera: take many photos, then add them all at once ---------- */
async function addShots(shots, target){
  const w = S.walk; if(!w || !shots.length) return;
  const it = target === 'item' ? w.items.find(x => x.id === S.itemId) : null;
  if(target === 'item' && !it) return;
  w.sitePhotos = w.sitePhotos || [];
  let last = null;
  for(const sh of shots){
    const p = { id:'p' + uid(), src:sh.src, ann:null, shapes:[], w:sh.w, h:sh.h, taken:sh.taken, walkId:w.id, itemId: it ? it.id : null };
    if(!it){ p.kind = 'site'; p.caption = ''; }
    await DB.put('photos', p.id, p);
    if(it) it.photos.push(p.id); else w.sitePhotos.push(p.id);
    last = p;
  }
  saveWalk(true);
  toast(`Added ${shots.length} photo${shots.length > 1 ? 's' : ''}`);
  if(it && S.view === 'item' && S.itemId === it.id){ rerenderItem(); if(shots.length === 1 && last) openAnnotator(last); }
  if(!it && S.view === 'gallery') rerenderGallery();
}
async function openBurstCamera(onDone){
  const root = $('#camRoot');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('This browser cannot open the camera here. Use the phone\'s camera app link instead.'); return; }
  const constraints = { audio:false, video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1440 } } };
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia(constraints); }
  catch(e){
    toast(e && e.name === 'NotAllowedError' ? 'Camera access is blocked. Allow camera access for this app in Settings, or use the phone\'s camera app link.' : 'Could not start the camera. Use the phone\'s camera app link instead.');
    return;
  }
  const shots = []; let armedCancel = false;
  root.innerHTML = `<div class="cam" role="dialog" aria-label="Camera">
    <div class="cam-view"><video id="camV" playsinline muted autoplay></video><div class="cam-flash" id="camFlash"></div>
      <div class="cam-count" id="camCount">Tap the shutter for each photo</div></div>
    <div class="cam-strip" id="camStrip"></div>
    <div class="cam-bar">
      <button data-c="cancel" id="camCancel">Cancel</button>
      <button class="shutter" data-c="shoot" aria-label="Take photo"></button>
      <button data-c="done" class="done" id="camDone" disabled>Done</button>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  const video = $('#camV');
  const attach = async st => { stream = st; video.srcObject = st; try{ await video.play(); }catch(_){} };
  await attach(stream);
  const stop = () => {
    try{ stream.getTracks().forEach(t => t.stop()); }catch(_){}
    document.removeEventListener('visibilitychange', onVis);
    root.innerHTML = ''; root.onclick = null; document.body.style.overflow = '';
  };
  const onVis = async () => {
    if(document.visibilityState !== 'visible' || !root.firstChild) return;
    if(stream.getVideoTracks().every(t => t.readyState === 'ended')){
      try{ await attach(await navigator.mediaDevices.getUserMedia(constraints)); }catch(_){ toast('The camera stopped. Tap Done to keep your photos.'); }
    }
  };
  document.addEventListener('visibilitychange', onVis);
  const refresh = () => {
    $('#camCount').textContent = shots.length ? `${shots.length} photo${shots.length > 1 ? 's' : ''}` : 'Tap the shutter for each photo';
    const done = $('#camDone'); done.disabled = !shots.length; done.textContent = shots.length ? `Done (${shots.length})` : 'Done';
    $('#camStrip').innerHTML = shots.map((sh, i) => `<div class="t"><img src="${sh.src}" alt="Photo ${i + 1}"><button data-c="rm" data-i="${i}" aria-label="Remove photo ${i + 1}">×</button></div>`).join('');
    const strip = $('#camStrip'); strip.scrollLeft = strip.scrollWidth;
    armedCancel = false; $('#camCancel').textContent = 'Cancel';
  };
  const shoot = () => {
    const vw = video.videoWidth, vh = video.videoHeight; if(!vw || !vh) return;
    const sc = Math.min(1, 1600 / Math.max(vw, vh));
    const w = Math.round(vw * sc), h = Math.round(vh * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(video, 0, 0, w, h);
    shots.push({ src: cv.toDataURL('image/jpeg', 0.85), w, h, taken: Date.now() });
    const fl = $('#camFlash'); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 60);
    try{ navigator.vibrate && navigator.vibrate(15); }catch(_){}
    refresh();
  };
  root.onclick = e => {
    const b = e.target.closest('[data-c]'); if(!b || b.disabled) return;
    const c = b.dataset.c;
    if(c === 'shoot') shoot();
    else if(c === 'rm'){ shots.splice(Number(b.dataset.i), 1); refresh(); }
    else if(c === 'done'){ const out = shots.slice(); stop(); onDone(out); }
    else if(c === 'cancel'){
      if(shots.length && !armedCancel){ armedCancel = true; b.textContent = `Discard ${shots.length}?`; return; }
      stop();
    }
  };
  refresh();
}

/* ---------- photos ---------- */
function loadImage(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function processPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImage(url);
    const max = 1600; const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(im, 0, 0, w, h);
    return { id:'p' + uid(), src: cv.toDataURL('image/jpeg', 0.82), ann:null, shapes:[], w, h, taken:Date.now() };
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- annotator ---------- */
const COLORS = [['#ff2d2d','Red'],['#ffd400','Yellow'],['#ffffff','White'],['#1e90ff','Blue']];
const TEXT_FONT = '"Montserrat", "Helvetica Neue", Arial, sans-serif';
const TEXT_LH = 1.18;
function textRect(s){ return { x:Math.min(s.a[0], s.b[0]), y:Math.min(s.a[1], s.b[1]), w:Math.abs(s.b[0]-s.a[0]), h:Math.abs(s.b[1]-s.a[1]) }; }
function wrapLines(ctx, text, maxW){
  const out = [];
  String(text).split('\n').forEach(para => {
    const words = para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(''); return; }
    let line = '';
    for(let word of words){
      while(ctx.measureText(word).width > maxW && word.length > 1){
        let k = word.length - 1;
        while(k > 1 && ctx.measureText(word.slice(0, k)).width > maxW) k--;
        if(line){ out.push(line); line = ''; }
        out.push(word.slice(0, k)); word = word.slice(k);
      }
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width <= maxW) line = test;
      else { if(line) out.push(line); line = word; }
    }
    out.push(line);
  });
  return out;
}
/* Largest font size whose wrapped lines fit the box. More text -> smaller size. */
function fitText(ctx, text, w, h, maxSize, minSize){
  let lo = minSize, hi = Math.max(minSize, Math.floor(maxSize)), best = null;
  while(lo <= hi){
    const mid = Math.floor((lo + hi) / 2);
    ctx.font = `600 ${mid}px ${TEXT_FONT}`;
    const lines = wrapLines(ctx, text || ' ', w);
    if(lines.length * mid * TEXT_LH <= h){ best = { size:mid, lines }; lo = mid + 1; } else hi = mid - 1;
  }
  if(!best){ ctx.font = `600 ${minSize}px ${TEXT_FONT}`; best = { size:minSize, lines:wrapLines(ctx, text || ' ', w) }; }
  return best;
}

async function openAnnotator(photo){
  const root = $('#annRoot');
  const img = await loadImage(photo.src);
  let shapes = JSON.parse(JSON.stringify(photo.shapes || []));
  let tool = 'arrow', color = COLORS[0][0], cur = null, editing = null, ta = null;
  const imgMax = Math.max(photo.w, photo.h);
  const lw = Math.max(4, Math.round(imgMax / 110));
  const minFont = Math.max(8, Math.round(imgMax / 95));
  const HINTS = { text:'Drag to draw a text box, or tap to place one, then type. Text shrinks to fit the box.' };
  root.innerHTML = `<div class="ann" role="dialog" aria-label="Mark up photo">
    <div class="ann-hint" id="annHint">Draw on the photo to point out the issue</div>
    <div class="ann-stage"><canvas id="annCv" width="${photo.w}" height="${photo.h}"></canvas></div>
    <div class="ann-bar" id="annTools">
      <button data-t="arrow" aria-label="Arrow">${I.arrow}</button>
      <button data-t="circle" aria-label="Circle">${I.circle}</button>
      <button data-t="box" aria-label="Box">${I.box}</button>
      <button data-t="pen" aria-label="Freehand">${I.pen}</button>
      <button data-t="text" aria-label="Text">${I.text}</button>
      <span class="sep"></span>
      ${COLORS.map(([c,n]) => `<button class="sw" data-c="${c}" aria-label="${n}"><i style="background:${c}"></i></button>`).join('')}
    </div>
    <div class="ann-bar" id="annMain">
      <button data-a="undo">${I.undo}<span>Undo</span></button>
      <button data-a="clear">Clear</button>
      <button data-a="cancel">Cancel</button>
      <button data-a="save" class="save">Save</button>
    </div>
    <div class="ann-bar" id="annEdit" hidden>
      <button data-a="deltext">${I.trash}<span>Delete text</span></button>
      <button data-a="donetext" class="save">Done</button>
    </div>
  </div>`;
  document.body.style.overflow = 'hidden';
  const cv = $('#annCv'); const ctx = cv.getContext('2d');
  const sync = () => {
    root.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === tool)));
    root.querySelectorAll('[data-c]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === color)));
    $('#annHint').textContent = HINTS[tool] || 'Draw on the photo to point out the issue';
    $('#annMain').hidden = !!editing; $('#annEdit').hidden = !editing;
  };
  const textPad = s => s.w * 1.2;
  const textFit = s => { const r = textRect(s), p = textPad(s); return fitText(ctx, s.text, r.w - 2*p, r.h - 2*p, Math.min(r.h - 2*p, imgMax / 9), minFont); };
  const textBg = c => (c === '#ffffff' || c === '#ffd400') ? 'rgba(0,0,0,.62)' : 'rgba(255,255,255,.88)';
  function drawText(s){
    const r = textRect(s), p = textPad(s);
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, s.w); else ctx.rect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = textBg(s.color); ctx.fill();
    ctx.lineWidth = Math.max(2, s.w * 0.5); ctx.strokeStyle = s.color;
    if(s === editing) ctx.setLineDash([s.w * 1.5, s.w]);
    ctx.stroke();
    if(s !== editing && s.text){
      const f = textFit(s);
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
      ctx.font = `600 ${f.size}px ${TEXT_FONT}`; ctx.fillStyle = s.color; ctx.textBaseline = 'top';
      f.lines.forEach((ln, i) => ctx.fillText(ln, r.x + p, r.y + p + i * f.size * TEXT_LH + f.size * (TEXT_LH - 1) / 2));
    }
    ctx.restore();
  }
  function drawShape(s){
    if(s.type === 'text') return drawText(s);
    ctx.save();
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = s.w * 1.2;
    ctx.beginPath();
    if(s.type === 'pen'){
      s.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    } else if(s.type === 'arrow'){
      const [x1,y1] = s.a, [x2,y2] = s.b; const ang = Math.atan2(y2-y1, x2-x1); const hl = s.w * 4.5;
      ctx.moveTo(x1,y1); ctx.lineTo(x2 - Math.cos(ang)*hl*0.6, y2 - Math.sin(ang)*hl*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2);
      ctx.lineTo(x2 - hl*Math.cos(ang - 0.45), y2 - hl*Math.sin(ang - 0.45));
      ctx.lineTo(x2 - hl*Math.cos(ang + 0.45), y2 - hl*Math.sin(ang + 0.45));
      ctx.closePath(); ctx.fill();
    } else if(s.type === 'circle'){
      const cx = (s.a[0]+s.b[0])/2, cy = (s.a[1]+s.b[1])/2;
      ctx.ellipse(cx, cy, Math.max(1, Math.abs(s.b[0]-s.a[0])/2), Math.max(1, Math.abs(s.b[1]-s.a[1])/2), 0, 0, Math.PI*2); ctx.stroke();
    } else if(s.type === 'box'){
      ctx.strokeRect(Math.min(s.a[0],s.b[0]), Math.min(s.a[1],s.b[1]), Math.abs(s.b[0]-s.a[0]), Math.abs(s.b[1]-s.a[1]));
    }
    ctx.restore();
  }
  function draw(){ ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height); shapes.forEach(drawShape); if(cur) drawShape(cur); }
  const pos = e => { const r = cv.getBoundingClientRect(); return [ (e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height ]; };
  const inside = (s, p) => { const r = textRect(s); return p[0] >= r.x && p[0] <= r.x + r.w && p[1] >= r.y && p[1] <= r.y + r.h; };

  /* Text editing: a textarea laid over the box. It keeps a 16px font (so phones do not zoom) and is scaled to the fitted size. */
  function layoutTA(){
    if(!editing || !ta) return;
    const rc = cv.getBoundingClientRect(), sc = rc.width / cv.width;
    const r = textRect(editing), p = textPad(editing), f = textFit(editing);
    const k = Math.max(0.05, (f.size * sc) / 16);
    Object.assign(ta.style, {
      left: (rc.left + r.x * sc) + 'px', top: (rc.top + r.y * sc) + 'px',
      width: (r.w * sc / k) + 'px', height: (r.h * sc / k) + 'px',
      padding: (p * sc / k) + 'px', transform: `scale(${k})`, color: editing.color
    });
  }
  function openEditor(s){
    editing = s; tool = 'text';
    ta = document.createElement('textarea');
    ta.className = 'ann-ta'; ta.value = s.text || ''; ta.setAttribute('aria-label', 'Text on photo');
    ta.setAttribute('autocapitalize', 'sentences'); ta.spellcheck = true;
    root.querySelector('.ann').appendChild(ta);
    ta.addEventListener('input', () => { editing.text = ta.value; layoutTA(); });
    layoutTA(); sync(); draw();
    ta.focus({ preventScroll:true });
    try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(_){}
  }
  function commitText(remove){
    if(!editing) return;
    const s = editing;
    s.text = (ta ? ta.value : s.text || '').replace(/\s+$/, '').replace(/^\s+/, '');
    if(remove || !s.text) shapes = shapes.filter(x => x !== s);
    if(ta){ ta.remove(); ta = null; }
    editing = null; sync(); draw();
  }
  const relayout = () => layoutTA();
  window.addEventListener('resize', relayout);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = pos(e);
    if(editing){ if(!inside(editing, p)) commitText(); else if(ta) ta.focus({ preventScroll:true }); return; }
    if(tool === 'text'){
      const hit = [...shapes].reverse().find(s => s.type === 'text' && inside(s, p));
      if(hit){ openEditor(hit); return; }
    }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    cur = tool === 'pen' ? { type:'pen', color, w:lw, pts:[p] }
        : tool === 'text' ? { type:'text', color, w:lw, a:p, b:p, text:'' }
        : { type:tool, color, w:lw, a:p, b:p };
    draw();
  });
  cv.addEventListener('pointermove', e => {
    if(!cur) return; e.preventDefault(); const p = pos(e);
    if(cur.type === 'pen') cur.pts.push(p); else cur.b = p;
    draw();
  });
  const end = () => {
    if(!cur) return;
    const s = cur; cur = null;
    if(s.type === 'text'){
      let r = textRect(s);
      const minW = imgMax * 0.18, minH = imgMax * 0.07;
      if(r.w < lw * 3 && r.h < lw * 3){
        const w = Math.min(cv.width * 0.7, cv.width - lw * 2), h = Math.min(cv.height * 0.22, cv.height - lw * 2);
        r = { x: s.a[0] - w/2, y: s.a[1] - h/2, w, h };
      } else { r.w = Math.max(r.w, minW); r.h = Math.max(r.h, minH); }
      r.x = Math.max(0, Math.min(r.x, cv.width - r.w)); r.y = Math.max(0, Math.min(r.y, cv.height - r.h));
      s.a = [r.x, r.y]; s.b = [r.x + r.w, r.y + r.h];
      shapes.push(s); openEditor(s);
      return;
    }
    const big = s.type === 'pen' ? s.pts.length > 1 : Math.hypot(s.b[0]-s.a[0], s.b[1]-s.a[1]) > lw * 2;
    if(big) shapes.push(s); draw();
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  const close = () => {
    window.removeEventListener('resize', relayout);
    if(window.visualViewport) window.visualViewport.removeEventListener('resize', relayout);
    root.innerHTML = ''; root.onclick = null; document.body.style.overflow = '';
  };
  root.onclick = async e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.t){ if(editing) commitText(); tool = b.dataset.t; sync(); }
    else if(b.dataset.c){ color = b.dataset.c; if(editing){ editing.color = color; layoutTA(); draw(); } sync(); }
    else if(b.dataset.a === 'donetext') commitText();
    else if(b.dataset.a === 'deltext') commitText(true);
    else if(b.dataset.a === 'undo'){ shapes.pop(); draw(); }
    else if(b.dataset.a === 'clear'){ shapes = []; draw(); }
    else if(b.dataset.a === 'cancel') close();
    else if(b.dataset.a === 'save'){
      if(editing) commitText();
      cur = null; draw();
      photo.shapes = shapes; photo.ann = shapes.length ? cv.toDataURL('image/jpeg', 0.85) : null;
      await DB.put('photos', photo.id, photo);
      close();
      if(S.view === 'gallery') rerenderGallery();
      const it = S.walk && S.walk.items.find(x => x.id === S.itemId);
      if(it && S.view === 'item') renderPhotos(it);
      toast(shapes.length ? 'Markup saved' : 'Photo saved');
    }
  };
  sync(); draw();
}
