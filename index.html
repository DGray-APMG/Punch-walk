const MIME = { pdf:'application/pdf', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', zip:'application/zip', jpg:'image/jpeg', json:'application/json' };
function showFileReady(filename, data, note){
  if(S.capture){ S.capture.push({ name:filename, blob: data instanceof Blob ? data : new Blob([data]) }); return; }
  const ext = filename.split('.').pop().toLowerCase();
  const blob = data instanceof Blob && data.type ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
  const file = new File([blob], filename, { type: blob.type });
  let canShare = false;
  try{ canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })); }catch(e){}
  const root = $('#sheetRoot');
  const kb = blob.size > 1048576 ? (blob.size/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(blob.size/1024)) + ' KB';
  root.innerHTML = `<div class="sheet-back" data-s="close"><div class="sheet" role="dialog" aria-label="File ready">
    <div class="eyebrow">File ready</div>
    <div class="fname">${esc(filename)} <span class="muted mono">${kb}</span></div>
    <div class="note">${esc(note || (canShare ? 'Share opens your phone\'s share options: pick Mail to email it, or Dropbox, Files or OneDrive to save it.' : 'Save it to this device, then attach it to an email or upload it.'))}</div>
    ${canShare ? `<button class="btn primary block" data-s="share">${I.share}<span>Share</span></button>` : ''}
    <button class="btn block ${canShare ? '' : 'primary'}" data-s="save">${I.file}<span>Save to this device</span></button>
    <button class="btn block" data-s="close">Close</button>
  </div></div>`;
  const close = () => { root.innerHTML = ''; root.onclick = null; };
  root.onclick = async e => {
    const b = e.target.closest('[data-s]'); if(!b) return;
    if(b.classList.contains('sheet-back') && e.target !== b) return;
    const a = b.dataset.s;
    if(a === 'close') close();
    else if(a === 'share'){
      try{ await navigator.share({ files:[file] }); close(); }
      catch(err){ if(err && err.name !== 'AbortError') toast('Sharing failed. Use Save to this device instead.'); }
    } else if(a === 'save'){
      const url = URL.createObjectURL(blob); const link = document.createElement('a');
      link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Saved'); close();
    }
  };
}
async function saveFile(filename, data, msgEl){
  showFileReady(filename, data);
  if(msgEl) msgEl.textContent = `${filename} is ready.`;
  return true;
}
const safeName = s => String(s || 'Stand').replace(/[\\/:*?"<>|]+/g, '-').trim();
function dataURLBytes(u){ const b = atob(u.slice(u.indexOf(',') + 1)); const a = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function itemPhotoList(items){
  const w = S.walk; const list = [];
  for(const loc of w.locations) for(const it of items.filter(x => x.location === loc)){
    const recs = (await Promise.all(it.photos.map(id => DB.get('photos', id)))).filter(Boolean);
    const base = safeName(`#${it.no || '-'} ${it.item}`).slice(0, 60).trim();
    recs.forEach((p, i) => {
      const n = recs.length > 1 ? ` (${i + 1})` : '';
      if(p.ann){ list.push({ folder:safeName(loc), name:`${base}${n} - marked up.jpg`, url:p.ann }); list.push({ folder:safeName(loc), name:`${base}${n} - original.jpg`, url:p.src }); }
      else list.push({ folder:safeName(loc), name:`${base}${n}.jpg`, url:p.src });
    });
  }
  return list;
}
async function exportPhotos(items, btn, msgEl){
  const w = S.walk; const list = await itemPhotoList(items);
  const scope = items.length === 1 ? ` - item ${safeName(items[0].no || '')}` : '';
  await deliverPhotos(list, `${safeName(w.stand)} - ${w.date}${scope} - punch photos`, btn, msgEl);
}
/* Hand photos to the phone: one file directly, several as separate JPEGs through the share sheet (zip for saving). */
async function deliverPhotos(list, zipBase, btn, msgEl){
  const out = msgEl || { set textContent(v){ toast(v); } };
  if(!list.length){ out.textContent = 'No photos to export.'; return; }
  btn.disabled = true;
  try{
    if(list.length === 1){ showFileReady(list[0].name, new Blob([dataURLBytes(list[0].url)], { type:'image/jpeg' })); return; }
    const files = list.map(f => new File([dataURLBytes(f.url)], f.name, { type:'image/jpeg' }));
    let canShare = false;
    try{ canShare = !!(navigator.canShare && navigator.canShare({ files })); }catch(e){}
    const root = $('#sheetRoot');
    root.innerHTML = `<div class="sheet-back" data-s="close"><div class="sheet" role="dialog" aria-label="Photos ready">
      <div class="eyebrow">Photos ready</div>
      <div class="fname">${list.length} JPEG photos</div>
      <div class="note">${canShare ? 'Share sends them as separate JPEG files: choose Save Images to put them in Photos, Save to Files, Mail, or Dropbox.' : 'Save them to this device as one .zip of JPEG files.'}</div>
      ${canShare ? `<button class="btn primary block" data-s="share">${I.share}<span>Share ${list.length} photos</span></button>` : ''}
      <button class="btn block ${canShare ? '' : 'primary'}" data-s="zip">${I.file}<span>Save as .zip</span></button>
      <button class="btn block" data-s="close">Close</button>
    </div></div>`;
    const close = () => { root.innerHTML = ''; root.onclick = null; };
    root.onclick = async e => {
      const b = e.target.closest('[data-s]'); if(!b) return;
      if(b.classList.contains('sheet-back') && e.target !== b) return;
      const a = b.dataset.s;
      if(a === 'close') close();
      else if(a === 'share'){
        try{ await navigator.share({ files }); close(); }
        catch(err){ if(err && err.name !== 'AbortError') toast('Sharing failed. Use Save as .zip instead.'); }
      } else if(a === 'zip'){
        if(!window.JSZip){ toast('The zip builder did not load.'); return; }
        b.disabled = true;
        const zip = new window.JSZip(); const folder = zip.folder(zipBase);
        list.forEach(f => folder.file((f.folder ? f.folder + '/' : '') + f.name, dataURLBytes(f.url), { binary:true }));
        const blob = await zip.generateAsync({ type:'blob', compression:'STORE' });
        const url = URL.createObjectURL(blob); const link = document.createElement('a');
        link.href = url; link.download = zipBase + '.zip'; document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Saved'); close();
      }
    };
  }catch(err){ out.textContent = 'Could not export the photos.'; }
  finally{ btn.disabled = false; }
}

async function makePDF(btn){
  const msg = $('#repMsg') || {};
  if(!window.jspdf){ msg.textContent = 'The PDF builder did not load. Check the connection and reopen the app.'; return; }
  const w = S.walk, o = repOpts(), items = reportItems(w, o);
  const siteIds = o.site ? (w.sitePhotos || []) : [];
  if(!items.length && !siteIds.length){ msg.textContent = 'No items match these filters.'; return; }
  btn.disabled = true; msg.textContent = 'Building PDF…';
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'letter' });
    const W = 612, H = 792, M = 40, CW = W - 2*M;
    let y = M;
    const ink = [21,33,43], muted = [91,104,114], line = [211,218,222];
    const SC = { open:[194,50,31], complete:[31,122,63], na:[111,124,134], todo:[150,160,168] };
    const ensure = h => { if(y + h > H - M - 16){ doc.addPage(); y = M; } };
    const text = (s, x, size, style, color, maxW) => {
      doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || ink));
      const lines = doc.splitTextToSize(String(s ?? ''), maxW || CW); const lh = size * 1.25;
      lines.forEach(l => { ensure(lh); doc.text(l, x, y + size); y += lh; });
    };
    const rule = () => { doc.setDrawColor(...line); doc.setLineWidth(0.8); doc.line(M, y, W - M, y); y += 10; };

    // Header: 7 Brew primary horizontal logo (brand minimum height 0.5 in = 36 pt) and a Stand Blue title
    const blue = [0,86,180], red = [228,0,43];
    try{
      const lg = await fetch('brand/logo-horizontal.png').then(r => r.blob()).then(bl => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(bl); }));
      const lh = 40, lw = lh * 720 / 229;
      doc.addImage(lg, 'PNG', W - M - lw, M - 6, lw, lh, undefined, 'FAST');
    }catch(_){}
    text('PUNCH WALK REPORT', M, 10, 'bold', red, CW - 150);
    text(w.stand || 'Untitled stand', M, 22, 'bold', blue, CW - 150);
    if(w.address) text(w.address, M, 11, 'normal', muted, CW - 150);
    y = Math.max(y, M + 44) + 6;
    const meta = [['Walk date', fmtDate(w.date)], ['General contractor', w.gc], ['Walked by', w.by], ['Attendees', w.attendees], ['Report generated', new Date().toLocaleString()], ['Report filters', describeFilters(o)]].filter(r => r[1]);
    meta.forEach(([k,v]) => {
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      const lines = doc.splitTextToSize(String(v), CW - 130);
      ensure(lines.length * 13 + 2);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...muted); doc.text(k.toUpperCase(), M, y + 9.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
      lines.forEach((l,i) => doc.text(l, M + 130, y + 10 + i*13));
      y += Math.max(1, lines.length) * 13 + 2;
    });
    y += 8;

    // Summary of the items in this report
    const c = { complete:0, open:0, na:0, todo:0 }; items.forEach(it => c[stKey(it)]++);
    ensure(56);
    const boxes = [['In report', items.length, ink], ['Not complete', c.open, SC.open], ['Not checked', c.todo, muted], ['Complete', c.complete, SC.complete], ['N/A', c.na, SC.na]];
    const bw = (CW - 4*8) / 5;
    boxes.forEach(([k,n,col], i) => {
      const x = M + i*(bw + 8);
      doc.setDrawColor(...line); doc.setLineWidth(0.8); doc.roundedRect(x, y, bw, 46, 4, 4, 'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(...col); doc.text(String(n), x + 8, y + 22);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...muted); doc.text(k, x + 8, y + 37);
    });
    y += 60;

    // By responsible party
    const byResp = {};
    items.forEach(it => { const k = respOf(it); byResp[k] = byResp[k] || { n:0, open:0, todo:0, complete:0, na:0 }; byResp[k].n++; byResp[k][stKey(it)]++; });
    const rows = Object.entries(byResp).sort((a,b) => b[1].open - a[1].open || b[1].n - a[1].n || a[0].localeCompare(b[0]));
    if(rows.length){
      text('By responsible party', M, 12, 'bold', blue); y += 2;
      const cols = [['Items', 'n'], ['Not complete', 'open'], ['Not checked', 'todo'], ['Complete', 'complete'], ['N/A', 'na']];
      const cx = i => W - M - (cols.length - 1 - i) * 76;
      ensure(16);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...muted);
      doc.text('RESPONSIBLE', M, y + 9); cols.forEach(([h], i) => doc.text(h.toUpperCase(), cx(i), y + 9, { align:'right' }));
      y += 14;
      rows.forEach(([k, v]) => {
        ensure(15); doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
        doc.text(doc.splitTextToSize(k, CW - 400)[0], M, y + 10);
        cols.forEach(([, f], i) => { doc.setTextColor(...(f === 'open' && v[f] ? SC.open : ink)); doc.text(String(v[f]), cx(i), y + 10, { align:'right' }); });
        y += 15;
      });
      y += 6;
    }

    // Items
    rule();
    text(`Items (${items.length})`, M, 15, 'bold', blue); y += 2;
    let lastGroup;
    for(const it of items){
      const g = groupOf(o, it);
      if(g !== null && g !== lastGroup){ ensure(44); y += 6; text(g.toUpperCase(), M, 10, 'bold', muted); lastGroup = g; }
      const k = stKey(it);
      ensure(40);
      const top = y;
      text(`#${it.no || '—'}   ${it.item}`, M + 10, 11, 'bold', ink, CW - 10);
      const metaLine = [ST_LABEL[k] + (it.fa ? ', final approval given' : ''), 'Responsible: ' + respOf(it), o.sort === 'location' ? null : it.location, 'Division: ' + (it.division || '—')].filter(Boolean).join('   ·   ');
      text(metaLine, M + 10, 9.5, 'normal', k === 'open' ? SC.open : muted, CW - 10);
      if(y > top) { doc.setFillColor(...SC[k]); doc.rect(M, top + 2, 3, Math.min(y - top, 40) - 2, 'F'); }
      if((it.notes || '').trim()) text(it.notes, M + 10, 10.5, 'normal', ink, CW - 10);
      if(o.photos && it.photos.length){
        let recs = (await Promise.all(it.photos.map(id => DB.get('photos', id)))).filter(Boolean);
        if(S.pdfMaxPx) recs = await Promise.all(recs.map(async p => Object.assign({}, p, { ann:null, src:(await shrinkDataURL(p.ann || p.src, S.pdfMaxPx, 0.72)).src })));
        const colW = (CW - 10 - 10) / 2, maxH = 200;
        y += 4;
        for(let i = 0; i < recs.length; i += 2){
          const pair = recs.slice(i, i+2).map(p => { const s = Math.min(colW / p.w, maxH / p.h); return { p, w:p.w*s, h:p.h*s }; });
          const rh = Math.max(...pair.map(q => q.h));
          ensure(rh + 8);
          pair.forEach((q, j) => doc.addImage(q.p.ann || q.p.src, 'JPEG', M + 10 + j*(colW + 10), y, q.w, q.h, undefined, 'FAST'));
          y += rh + 8;
        }
      }
      y += 8;
    }

    // Site photos
    const siteRecs = (await Promise.all(siteIds.map(id => DB.get('photos', id)))).filter(Boolean);
    if(siteRecs.length){
      ensure(80); y += 6; rule();
      text(`Site photos (${siteRecs.length})`, M, 15, 'bold', blue); y += 6;
      const colW = (CW - 12) / 2, maxH = 210, capLH = 11.5;
      for(let i = 0; i < siteRecs.length; i += 2){
        const pair = siteRecs.slice(i, i + 2).map((p, j) => {
          const sc = Math.min(colW / p.w, maxH / p.h);
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
          const label = `${i + j + 1}.${p.caption ? ' ' + p.caption : ''}`;
          return { p, w:p.w*sc, h:p.h*sc, cap: doc.splitTextToSize(label, colW) };
        });
        const rowH = Math.max(...pair.map(q => q.h)) + Math.max(...pair.map(q => q.cap.length)) * capLH + 14;
        ensure(rowH);
        pair.forEach((q, j) => {
          const x = M + j * (colW + 12);
          doc.addImage(q.p.ann || q.p.src, 'JPEG', x, y, q.w, q.h, undefined, 'FAST');
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...muted);
          q.cap.forEach((ln, k) => doc.text(ln, x, y + q.h + 12 + k * capLH));
        });
        y += rowH;
      }
    }

    const pages = doc.getNumberOfPages();
    for(let i = 1; i <= pages; i++){
      doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text(`${w.stand || ''}  ·  Punch walk ${fmtDate(w.date)}`, M, H - 22);

    }
    const scope = reportScopeName(o);
    await saveFile(`Punch Walk - ${safeName(w.stand)} - ${w.date}${scope}.pdf`, doc.output('blob'), msg);
  }catch(err){ msg.textContent = 'Could not build the PDF. ' + (err && err.message ? err.message : ''); }
  btn.disabled = false;
}
function reportScopeName(o){

    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Punch Walk');
    const out = XLSX.write(wb, { type:'array', bookType:'xlsx' });
    await saveFile(`Punch Walk - ${safeName(w.stand)} - ${w.date}${reportScopeName(o)}.xlsx`, new Blob([out]), msg);
  }catch(err){ msg.textContent = 'Could not build the Excel file.'; }
  btn.disabled = false;
}

/* ---------- vendor package: task file + punch list PDF + instructions PDF in one .zip ---------- */
async function imgData(url){
  const bl = await fetch(url).then(r => { if(!r.ok) throw new Error(url); return r.blob(); });
  const src = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(bl); });
  const im = await loadImg(src);
  return { src, w: im.naturalWidth, h: im.naturalHeight };
}
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
async function makeInstructionsPDF(info){
  const { jsPDF } = window.jspdf;
  const w = S.walk, url = vendorPageURL();
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const W = 612, H = 792, M = 50, CW = W - 2*M;
  const blue = [0,86,180], red = [228,0,43], ink = [16,16,16], muted = [85,96,108], soft = [238,246,252];
  let y = M;
  const need = h => { if(y + h > H - M){ doc.addPage(); y = M; } };
  const text = (t, size, opts = {}) => {
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(opts.color || ink));
    const x = opts.x || M, width = opts.width || CW;
    const lines = doc.splitTextToSize(t, width);
    need(lines.length * size * 1.3);
    doc.text(lines, x, y + size); y += lines.length * size * 1.3 + (opts.after || 0);
  };
  const imgs = {};
  for(const k of ['v1','v2','v3','v5','v6','v7']){ try{ imgs[k] = await imgData(`guide/${k}.jpg`); }catch(e){} }
  const shot = (k, frac, cap) => {
    const im = imgs[k]; if(!im) return;
    const wd = CW * frac - 40, ht = wd * im.h / im.w;
    need(ht + 24);
    doc.setDrawColor(217,225,234); doc.setLineWidth(0.8); doc.rect(M + 40 - 0.5, y - 0.5, wd + 1, ht + 1);
    doc.addImage(im.src, 'JPEG', M + 40, y, wd, ht, undefined, 'FAST'); y += ht + 4;
    text(cap, 8, { color: muted, x: M + 40, width: wd, after: 8 });
  };
  // Header
  try{ const lg = await imgData('brand/logo-horizontal.png'); const lh = 40, lw = lh * lg.w / lg.h; doc.addImage(lg.src, 'PNG', M, y, lw, lh, undefined, 'FAST'); }catch(e){}
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...blue); doc.text('VENDOR INSTRUCTIONS', W - M, y + 26, { align:'right' });
  y += 50; doc.setDrawColor(...blue); doc.setLineWidth(2.5); doc.line(M, y, W - M, y); y += 16;
  text('Completing your punch list items', 22, { bold:true, color: blue, after: 2 });
  text(`Stand #${w.stand}${w.address ? ' – ' + w.address : ''}`, 13, { bold:true, after: 10 });
  // Key facts box
  const facts = [
    ['Vendor page', url, true],
    ['Password', `${w.stand}  (the stand number)`],
    ['Task file', info.taskFile],
    ['Tasks', `${info.count} task${info.count === 1 ? '' : 's'}${info.resp ? ' for ' + info.resp : ''}`]
  ];
  if(info.due) facts.push(['Respond by', info.due]);
  const boxH = facts.length * 17 + 16; need(boxH);
  doc.setFillColor(...soft); doc.rect(M, y, CW, boxH, 'F'); doc.setFillColor(129,193,234); doc.rect(M, y, 4, boxH, 'F');
  let fy = y + 20;
  facts.forEach(([k, v, link]) => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text(k, M + 16, fy);
    doc.setFont('helvetica', link ? 'bold' : 'normal'); doc.setTextColor(...(link ? blue : ink));
    const vv = doc.splitTextToSize(v, CW - 170)[0];
    if(link) doc.textWithLink(vv, M + 150, fy, { url: v }); else doc.text(vv, M + 150, fy);
    fy += 17;
  });
  y += boxH + 14;
  text('How it works', 13, { bold:true, after: 2 });
  text('We track punch list items with a simple web page. For each task assigned to you, add photos of the finished work and a note, then email a response file back to the project manager. There is no account to create and nothing to install. Your photos are not uploaded anywhere; they travel only in the file you email back.', 10, { after: 6 });
  text('This package contains three files: these instructions, the punch list (PDF) for reference, and your task file (.json), which you open on the vendor page.', 10, { after: 10 });
  const steps = [
    ['Save the task file', `Save "${info.taskFile}" to your computer or phone. Do not open, edit or rename it. On iPhone, use Save to Files.`],
    ['Open the vendor page', `On the same computer or phone, go to ${url}. Use the same device until you send your response, because your work is saved in that browser.`, null],
    ['Open the task file and enter the password', `Click Choose task file and select the file, or drag it onto the box. Enter the stand number as the password: ${w.stand}. Then click Open tasks.`, [['v1', .9, 'Choose or drag in the task file.'], ['v2', .62, 'The password is the stand number.']]],
    ['Enter your contact information', 'Enter your name, company and email, then click Continue to tasks. The project manager uses your email to tell you which tasks were accepted or need more work.', [['v3', .55, 'Your contact information.']]],
    ['Update each task', 'Each card shows the task and the project manager\'s notes and photos on the left. On the right: click Add completion photos (or drag photos onto the box), write a note about what was done, and check Mark this task complete when the work is finished. Use Not updated and Updated at the top to see what is left.', [['v5', .95, 'A completed task: photos added, note written, marked complete.']]],
    ['Create the response file and email it back', `Click Create response file at the bottom of the page, then Save response file. Email the saved file to the project manager who sent you this package, as an attachment. Start the email opens a pre-filled email, but you still need to attach the file.`, [['v6', .62, 'Save the response file, then attach it to your email.']]]
  ];
  steps.forEach(([title, body, pics], i) => {
    need(60);
    doc.setFillColor(...blue); doc.circle(M + 12, y + 11, 12, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(255,255,255); doc.text(String(i + 1), M + 12, y + 15.5, { align:'center' });
    const y0 = y; text(title, 13, { bold:true, x: M + 40, width: CW - 40, after: 2 }); if(y < y0 + 24) y = y0 + 24;
    text(body, 10, { x: M + 40, width: CW - 40, after: 6 });
    (pics || []).forEach(([k, f, c]) => shot(k, f, c));
    y += 6;
  });
  text('Coming back later', 13, { bold:true, after: 2 });
  text('Your photos and notes are saved in the browser as you work. Reopen the vendor page on the same device, click Continue, and enter the stand number again. Do not clear your browser history or use a private or incognito window, or your saved work will be lost.', 10, { after: 4 });
  shot('v7', .95, 'Pick up where you left off.');
  text('Tips', 13, { bold:true, after: 2 });
  [
    'Wrong password or the file will not open: use the stand number exactly as written above, and make sure you selected the .json task file.',
    'Response file too large to email: send your work in batches. Create a response file after every 30 to 40 photos, email it, then keep going.',
    'Need to fix something after sending: make the change and create a new response file.',
    'A task was sent back as not complete: fix the work, add new photos to that task, and send another response file.',
    'Questions: contact the project manager who sent you this package.'
  ].forEach(t => text('•  ' + t, 9.5, { after: 3 }));
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){ doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...muted); doc.text(`Stand #${w.stand} · Vendor instructions · Page ${i} of ${n}`, W / 2, H - 24, { align:'center' }); }
  return doc.output('blob');
}
async function buildVendorPackage(btn){
  const w = S.walk;
  if(!normStand(w.stand)){ toast('Add the stand number in Walk details first. It is the vendor password.'); return; }
  const items = vendorItems();
  if(!items.length){ toast('No items match. Change the responsible party or include more statuses.'); return; }
  if(!window.JSZip || !window.jspdf){ toast('The file builders did not load. Reopen the app with signal.'); return; }
  const vo = S.vendorOpts, keepRep = w.reportOpts;
  const emailEl = $('#v-cpmEmail'); const email = ((emailEl ? emailEl.value : await DB.get('meta', 'cpmEmail')) || '').trim();
  const label = safeName(vo.resp || 'All vendors');
  const base = `Vendor package - ${safeName(w.stand)} - ${label} - ${w.date}`;
  btn.disabled = true;
  try{
    S.capture = [];
    toast('Building vendor package: task file…', 120000);
    await buildVendorFile(btn); btn.disabled = true;
    const task = S.capture.find(f => /\.json$/.test(f.name)); if(!task) throw new Error('task file');
    toast('Building vendor package: punch list…', 120000);
    w.reportOpts = Object.assign(defaultRepOpts(), { st:{ open: !!vo.open, todo: !!vo.todo, complete:false, na:false }, resp: vo.resp ? [vo.resp] : [], photos: !!vo.photos, site:false, sort:'location' });
    S.capture = []; S.pdfMaxPx = 1000;
    await makePDF(btn); btn.disabled = true;
    S.pdfMaxPx = 0; w.reportOpts = keepRep;
    const list = S.capture.find(f => /\.pdf$/.test(f.name));
    S.capture = null;
    toast('Building vendor package: instructions…', 120000);
    const info = { taskFile: task.name, count: items.length, resp: vo.resp || '', email, due: w.vendorDue ? new Date(w.vendorDue + 'T12:00:00').toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' }) : '' };
    const instr = await makeInstructionsPDF(info);
    const zip = new window.JSZip();
    zip.file(`1 - Instructions - read first - ${safeName(w.stand)}.pdf`, instr);
    if(list) zip.file(`2 - Punch list - ${safeName(w.stand)} - ${label} - ${w.date}.pdf`, list.blob);
    zip.file(task.name, task.blob);
    const blob = await zip.generateAsync({ type:'blob', compression:'STORE', mimeType:'application/zip' });
    const t = $('.toast'); if(t) t.hidden = true;
    showFileReady(base + '.zip', blob, 'Share it to Dropbox or Files, or email it to the vendor. Use "Copy email text for the vendor" for the message. The vendor unzips it and starts with the instructions.');
  }catch(err){
    const t = $('.toast'); if(t) t.hidden = true;
    toast('Could not build the vendor package. Try again, or turn off "Include your photos".', 6000);
  }finally{
    S.capture = null; S.pdfMaxPx = 0; w.reportOpts = keepRep; btn.disabled = false;
  }
}

/* ---------- misc ---------- */
let lock = null;
async function wake(){ try{ if('wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }catch(e){ lock = null; } }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.walk) wake(); });

async function loadWalks(){ S.walks = (await DB.all('walks')) || []; }
async function init(){
  renderHome();
  await DB.open();
  S.template = (await DB.get('meta', 'template')) || null;
  await loadWalks();
  renderHome();
  await syncTeamTemplate();
  if(S.view === 'home') renderHome();
  registerSW();
}
function registerSW(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const flag = w => { S.updateReady = w; if(S.view === 'home') renderHome(); };
    if(reg.waiting && navigator.serviceWorker.controller) flag(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', () => { if(nw.state === 'installed' && navigator.serviceWorker.controller) flag(nw); });
    });
    setInterval(() => { if(navigator.onLine) reg.update().catch(() => {}); }, 3600000);
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; flush().then(() => location.reload()); });
}
/* ---- team template: encrypted file in the repo, unlocked with a passcode ---- */
const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptTemplate(t, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const key = await deriveKey(pass, salt, iter);
  const clean = Object.assign({}, t); delete clean.local; clean.loaded = Date.now();
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(clean))));
  return { format:'punch-walk-template', v:1, kdf:'PBKDF2-SHA256', iter, cipher:'AES-256-GCM', updated: clean.loaded, salt:b64(salt), iv:b64(iv), data:b64(ct) };
}
async function decryptTemplate(enc, pass){
  const key = await deriveKey(pass, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
  const t = JSON.parse(new TextDecoder().decode(pt));
  if(!t || !Array.isArray(t.items) || !t.items.length) throw new Error('empty');
  t.encUpdated = enc.updated; return t;
}
async function fetchEnc(){
  const r = await fetch('template.enc.json', { cache:'no-store' });
  if(!r.ok) throw new Error('missing');
  return r.json();
}
async function syncTeamTemplate(passTry){
  const pass = passTry || await DB.get('meta', 'pass');
  if(!pass){ if(!S.template){ S.needPass = true; } return; }
  let enc;
  try{ enc = await fetchEnc(); }catch(e){ if(passTry){ toast('Could not reach the checklist file. Connect to signal and try again.'); } return; }
  if(!passTry && S.template && !S.template.local && S.template.encUpdated === enc.updated) return;
  if(!passTry && S.template && S.template.local) return;
  try{
    const t = await decryptTemplate(enc, pass);
    S.template = t; S.needPass = false; S.passMsg = '';
    await DB.put('meta', 'template', t); await DB.put('meta', 'pass', pass);
    if(passTry) toast(`Checklist loaded: ${t.items.length} items`); else if(S.view === 'home') toast('Team checklist updated');
  }catch(e){
    if(passTry){ toast('That passcode did not work.'); }
    else { S.needPass = true; S.passMsg = 'The team checklist was updated with a new passcode. Enter it to get the latest list. You can keep using the current list until then.'; }
  }
  if(S.view === 'home') renderHome();
}
window.addEventListener('online', () => { S.online = true; syncTeamTemplate().then(() => { if(S.view === 'home') renderHome(); }); });
window.addEventListener('offline', () => { S.online = false; if(S.view === 'home') renderHome(); toast('No signal. Your work is still saving on this phone.'); });
init();
})();
