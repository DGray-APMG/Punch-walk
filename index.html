<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: single-column field app, sticky walk header, large tap targets for gloved/outdoor use */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#15212b; --muted:#5b6872; --line:#d3dade;
  --accent:#0b5d8a; --accent-ink:#ffffff; --accent-soft:#dcebf3;
  --ok:#1f7a3f; --ok-soft:#ddf1e3; --bad:#c2321f; --bad-soft:#fbe3df; --na:#6f7c86; --na-soft:#e6eaed;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222a; --surface-2:#1d2932; --ink:#e8edf0; --muted:#94a2ac; --line:#2c3a45;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#16364a;
  --ok:#4cc27a; --ok-soft:#163a25; --bad:#ff6b57; --bad-soft:#47201a; --na:#93a0a9; --na-soft:#26323b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222a; --surface-2:#1d2932; --ink:#e8edf0; --muted:#94a2ac; --line:#2c3a45;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#16364a;
  --ok:#4cc27a; --ok-soft:#163a25; --bad:#ff6b57; --bad-soft:#47201a; --na:#93a0a9; --na-soft:#26323b; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:780px;margin:0 auto;padding-bottom:48px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:8px}
.bar .title{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1;min-width:0}
.bar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:600;font-size:15px}
.iconbtn svg{width:20px;height:20px}

/* buttons */
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:20px;height:20px}

.section{padding-block:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--bad-soft)}

/* walk list cards */
.walk{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.walk .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.walk .stand{font-family:var(--font-display);font-weight:700;font-size:20px}
.prog{height:8px;border-radius:4px;background:var(--na-soft);overflow:hidden;display:flex;margin-top:10px}
.prog i{display:block;height:100%}
.prog .p-ok{background:var(--ok)} .prog .p-bad{background:var(--bad)} .prog .p-na{background:var(--na)}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.f span{font-family:var(--font-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}

/* walk header */
.whead{padding-block:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface-2);padding:6px 12px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input,.filters select{min-height:42px;padding:8px 10px;font-size:15px}

/* item rows */
.group{padding-block:14px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group h3{font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.items{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-left:6px solid var(--line)}
.row.st-complete{border-left-color:var(--ok)}
.row.st-open{border-left-color:var(--bad)}
.row.st-na{border-left-color:var(--na)}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:4px}
.row-main .txt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.row-main .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.row-main .no{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag svg{width:14px;height:14px}
.seg{display:flex;flex:none;border-left:1px solid var(--line)}
.seg button{width:50px;border:0;border-left:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.seg button:first-child{border-left:0}
.seg button svg{width:22px;height:22px}
.seg button.na{font-family:var(--font-display);font-size:15px;letter-spacing:.03em}
.seg button[aria-pressed="true"].ok{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].bad{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);color:#fff}
@media (max-width:400px){.seg button{width:44px}}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* item detail */
.bigseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bigseg button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.bigseg button svg{width:20px;height:20px}
.bigseg button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bigseg button[aria-pressed="true"].bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bigseg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .open{position:absolute;inset:0;border:0;background:none;padding:0}
.ph .badge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;pointer-events:none}
.ph .del{position:absolute;right:6px;top:6px;height:34px;min-width:34px;border-radius:8px;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px;padding:0 8px;display:flex;align-items:center;justify-content:center}
.ph .del.confirm{background:var(--bad)}
.ph .del svg{width:18px;height:18px}
.addph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.itemtext{font-size:20px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* annotator */
.ann{position:fixed;inset:0;z-index:50;background:#0b0f12;display:flex;flex-direction:column;color:#fff;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ann-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.ann canvas{max-width:100%;max-height:100%;touch-action:none;display:block;border-radius:4px}
.ann-bar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 10px}
.ann-bar button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid #33414c;background:#18222a;color:#fff;font-weight:600;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ann-bar button svg{width:20px;height:20px}
.ann-bar button[aria-pressed="true"]{background:#e8edf0;color:#0b0f12}
.ann-bar .sw{width:44px;padding:0}
.ann-bar .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid #fff}
.ann-bar .sw[aria-pressed="true"]{background:#33414c;color:#fff;outline:3px solid #e8edf0}
.ann-bar .save{background:#4fa8d8;border-color:#4fa8d8;color:#06131c}
.ann-bar .sep{width:1px;height:28px;background:#33414c;margin:0 2px}
.ann-hint{font-size:13px;color:#94a2ac;text-align:center;padding-top:6px}

.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .fname{font-weight:600;overflow-wrap:anywhere}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
details.more .stack{padding-top:8px}
.update{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--accent);color:var(--accent-ink);display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px}
.update button{background:var(--accent-ink);color:var(--accent);border:0;border-radius:8px;min-height:38px;padding:0 12px;font-weight:700}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets .chip{justify-content:center;padding:6px 4px;font-size:13.5px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
details.more summary{justify-content:space-between;gap:10px}
details.more summary .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.checks{display:flex;flex-direction:column;max-height:280px;overflow:auto;padding-top:4px}
.checks .check{min-height:40px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;min-height:40px;padding:0 4px}
.prev{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prev-group{font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:10px 12px 6px;background:var(--surface-2);border-top:1px solid var(--line)}
.prev-group:first-child{border-top:0}
.prev-row{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.3}
.prev-row .no{font-size:12px;color:var(--muted);min-width:34px;padding-top:2px}
.prev-row .meta{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.prev-row .grow{overflow-wrap:anywhere}
.pill{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.ann-ta{position:fixed;z-index:52;transform-origin:0 0;background:transparent;border:0;outline:none;resize:none;overflow:hidden;font-family:"Barlow","Helvetica Neue",Arial,sans-serif;font-weight:600;font-size:16px;line-height:1.18;margin:0;box-sizing:border-box;caret-color:currentColor;-webkit-text-size-adjust:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);font-size:15px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat div{border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.stat b{display:block;font-family:var(--font-mono);font-size:24px;font-weight:500}
.stat span{font-size:13px;color:var(--muted)}
.stat .s-ok{background:var(--ok-soft)} .stat .s-bad{background:var(--bad-soft)} .stat .s-na{background:var(--na-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function toast(msg){ let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 2600); }

/* ---------- storage (IndexedDB on this device, memory fallback) ---------- */
const DB = {
  db:null, ok:false, mem:{walks:new Map(), photos:new Map(), meta:new Map()},
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('punch-walk', 1);
        r.onupgradeneeded = () => { const d = r.result; ['walks','photos','meta'].forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.ok = true;
      try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    }catch(e){ this.ok = false; }
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      let req; const t = this.db.transaction(store, mode);
      req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(s,k){ if(!this.ok) return this.mem[s].get(k); try{ return await this.tx(s,'readonly',o=>o.get(k)); }catch(e){ return undefined; } },
  async put(s,k,v){ if(!this.ok){ this.mem[s].set(k,v); return; } try{ await this.tx(s,'readwrite',o=>o.put(v,k)); }catch(e){ toast('Could not save. Phone storage may be full.'); } },
  async del(s,k){ if(!this.ok){ this.mem[s].delete(k); return; } try{ await this.tx(s,'readwrite',o=>o.delete(k)); }catch(e){} },
  async all(s){ if(!this.ok) return [...this.mem[s].values()]; try{ return await this.tx(s,'readonly',o=>o.getAll()); }catch(e){ return []; } }
};

/* ---------- template parsing (reads the user's Excel at runtime) ---------- */
const cleanLoc = s => String(s || '').trim().replace(/^\.+/, '').replace(/^z(?=[A-Z])/, '').trim() || 'MISC.';
function limitedRows(ws){
  if(!ws || !ws['!ref']) return [];
  const r = XLSX.utils.decode_range(ws['!ref']);
  r.e.c = Math.min(r.e.c, 30); r.e.r = Math.min(r.e.r, 3000);
  return XLSX.utils.sheet_to_json(ws, {header:1, range:r, defval:null, raw:false, blankrows:false});
}
function parseTemplate(wb, fileName){
  const name = wb.SheetNames.find(n => /punch/i.test(n)) || wb.SheetNames[0];
  const rows = limitedRows(wb.Sheets[name]);
  let h = -1, col = {};
  for(let i = 0; i < Math.min(rows.length, 40); i++){
    const r = (rows[i] || []).map(c => String(c ?? '').trim().toLowerCase());
    if(r.includes('item') && r.some(c => c.startsWith('location'))){
      h = i;
      r.forEach((c, j) => {
        if(c === 'no' || c === 'no.' || c === '#') col.no = j;
        else if(c === 'item') col.item = j;
        else if(c.startsWith('division')) col.div = j;
        else if(c.startsWith('location')) col.loc = j;
        else if(c.startsWith('resp')) col.resp = j;
      });
      break;
    }
  }
  if(h < 0 || col.item == null) throw new Error('Could not find the Item and Location header row in this file.');
  const items = [];
  for(let i = h + 1; i < rows.length; i++){
    const r = rows[i] || [];
    const text = String(r[col.item] ?? '').trim();
    if(!text || /^description$/i.test(text)) continue;
    items.push({
      no: col.no != null ? String(r[col.no] ?? '').trim() : '',
      item: text,
      division: col.div != null ? String(r[col.div] ?? '').trim() : '',
      location: cleanLoc(col.loc != null ? r[col.loc] : ''),
      resp: col.resp != null ? String(r[col.resp] ?? '').trim() : ''
    });
  }
  if(!items.length) throw new Error('No checklist items were found under the header row.');
  const divisions = new Set(items.map(x => x.division).filter(Boolean));
  const resps = new Set(items.map(x => x.resp).filter(Boolean));
  const locations = new Set(items.map(x => x.location));
  const dataName = wb.SheetNames.find(n => /^data$/i.test(n.trim()));
  if(dataName){
    const dr = limitedRows(wb.Sheets[dataName]);
    let hdr = -1, dc = {};
    for(let i = 0; i < Math.min(dr.length, 15); i++){
      const r = (dr[i] || []).map(c => String(c ?? '').trim().toLowerCase());
      if(r.some(c => c.startsWith('division')) && r.some(c => c.startsWith('resp'))){
        hdr = i; r.forEach((c,j) => { if(c.startsWith('division')) dc.div = j; else if(c.startsWith('location')) dc.loc = j; else if(c.startsWith('resp')) dc.resp = j; }); break;
      }
    }
    if(hdr >= 0) for(let i = hdr + 1; i < dr.length; i++){
      const r = dr[i] || [];
      if(dc.div != null && r[dc.div]) divisions.add(String(r[dc.div]).trim());
      if(dc.resp != null && r[dc.resp]) resps.add(String(r[dc.resp]).trim());
      if(dc.loc != null && r[dc.loc]) locations.add(cleanLoc(r[dc.loc]));
    }
  }
  return { fileName, loaded: Date.now(), items, divisions:[...divisions].sort(), resps:[...resps].sort(), locations: orderLocs([...locations]) };
}
function orderLocs(list){
  const first = l => /pre-stand/i.test(l) ? 0 : /^misc/i.test(l) ? 2 : 1;
  return [...new Set(list)].sort((a,b) => first(a) - first(b) || a.localeCompare(b));
}

/* ---------- counts ---------- */
function counts(w){
  const c = { total:w.items.length, complete:0, open:0, na:0, todo:0, photos:0 };
  w.items.forEach(it => { if(it.status === 'complete') c.complete++; else if(it.status === 'open') c.open++; else if(it.status === 'na') c.na++; else c.todo++; c.photos += it.photos.length; });
  return c;
}
function progBar(c){
  const p = n => c.total ? (n / c.total * 100).toFixed(2) + '%' : '0';
  return `<div class="prog" aria-hidden="true"><i class="p-ok" style="width:${p(c.complete)}"></i><i class="p-bad" style="width:${p(c.open)}"></i><i class="p-na" style="width:${p(c.na)}"></i></div>`;
}

function itemVisible(it){
  if(S.filter !== 'all'){
    if(S.filter === 'todo' && it.status) return false;
    if(S.filter !== 'todo' && S.filter !== 'photos' && it.status !== S.filter) return false;
    if(S.filter === 'photos' && !it.photos.length) return false;
  }
  if(S.loc !== 'all' && it.location !== S.loc) return false;
  if(S.q){ const q = S.q.toLowerCase(); if(!(it.item.toLowerCase().includes(q) || String(it.no).includes(q) || (it.notes||'').toLowerCase().includes(q))) return false; }
  return true;
}
function visibleItems(){
  const w = S.walk; const out = [];
  w.locations.forEach(loc => w.items.forEach(it => { if(it.location === loc && itemVisible(it)) out.push(it); }));

/* ---------- report: filters, sorting, preview ---------- */
const ST_ORDER = { open:0, todo:1, complete:2, na:3 };
const ST_LABEL = { open:'Not complete', todo:'Not checked', complete:'Complete', na:'N/A' };
const ST_TOKEN = { open:'--bad', todo:'--muted', complete:'--ok', na:'--na' };
const SORTS = { location:'Location', number:'Item number', resp:'Responsible party', status:'Status', division:'Division' };
const stKey = it => it.status || 'todo';
const numOf = it => { const n = parseFloat(String(it.no ?? '').replace(/[^0-9.]/g, '')); return isNaN(n) ? Infinity : n; };
const respOf = it => it.resp || 'Unassigned';
const divOf = it => it.division || 'No division';
function defaultRepOpts(){ return { st:{ open:true, todo:true, complete:true, na:true }, resp:[], loc:[], div:[], noFrom:'', noTo:'', photosOnly:false, notesOnly:false, q:'', sort:'location', photos:true }; }
function repOpts(){
  const w = S.walk, d = defaultRepOpts();
  if(!w.reportOpts || typeof w.reportOpts !== 'object') w.reportOpts = d;
  const o = w.reportOpts;
  Object.keys(d).forEach(k => { if(o[k] === undefined) o[k] = d[k]; });
  o.st = Object.assign(d.st, o.st || {});
  ['resp','loc','div'].forEach(k => { if(!Array.isArray(o[k])) o[k] = []; });
  if(!SORTS[o.sort]) o.sort = 'location';
  return o;
}
function reportItems(w, o){
  const from = String(o.noFrom).trim() === '' ? null : Number(o.noFrom);
  const to = String(o.noTo).trim() === '' ? null : Number(o.noTo);
  const q = (o.q || '').trim().toLowerCase();
  const list = w.items.filter(it => {
    if(!o.st[stKey(it)]) return false;
    if(o.resp.length && !o.resp.includes(respOf(it))) return false;
    if(o.loc.length && !o.loc.includes(it.location)) return false;
    if(o.div.length && !o.div.includes(divOf(it))) return false;
    const n = numOf(it);
    if(from !== null && !isNaN(from) && !(n >= from)) return false;
    if(to !== null && !isNaN(to) && !(n <= to)) return false;
    if(o.photosOnly && !it.photos.length) return false;
    if(o.notesOnly && !(it.notes || '').trim()) return false;
    if(q && !(`${it.item} ${it.notes || ''} ${it.no}`).toLowerCase().includes(q)) return false;
    return true;
  });
  const li = l => { const i = w.locations.indexOf(l); return i < 0 ? 999 : i; };
  const byNum = (a, b) => { const x = numOf(a), y = numOf(b); return x === y ? 0 : x < y ? -1 : 1; };
  const primary = {
    location: (a, b) => li(a.location) - li(b.location),
    number: () => 0,
    resp: (a, b) => respOf(a).localeCompare(respOf(b)),
    status: (a, b) => ST_ORDER[stKey(a)] - ST_ORDER[stKey(b)],
    division: (a, b) => divOf(a).localeCompare(divOf(b))
  }[o.sort] || (() => 0);
  const idx = new Map(w.items.map((it, i) => [it, i]));
  list.sort((a, b) => primary(a, b) || (o.sort === 'number' ? 0 : li(a.location) - li(b.location)) || byNum(a, b) || (idx.get(a) - idx.get(b)));
  return list;
}
function groupOf(o, it){
  if(o.sort === 'location') return it.location;
  if(o.sort === 'resp') return respOf(it);
  if(o.sort === 'status') return ST_LABEL[stKey(it)];
  if(o.sort === 'division') return divOf(it);
  return null;
}
function describeFilters(o){
  const parts = [];
  const sts = Object.keys(ST_LABEL).filter(k => o.st[k]);
  parts.push(sts.length === 4 ? 'All statuses' : sts.length ? sts.map(k => ST_LABEL[k]).join(', ') : 'No statuses selected');
  if(o.resp.length) parts.push('Responsible: ' + o.resp.join(', '));
  if(o.loc.length) parts.push('Location: ' + o.loc.join(', '));
  if(o.div.length) parts.push('Division: ' + o.div.join(', '));
  const f = String(o.noFrom).trim(), t = String(o.noTo).trim();
  if(f || t) parts.push(`Item # ${f || 'start'} to ${t || 'end'}`);
  if(o.photosOnly) parts.push('With photos');
  if(o.notesOnly) parts.push('With notes');
  if((o.q || '').trim()) parts.push(`Text contains "${o.q.trim()}"`);
  parts.push('Sorted by ' + SORTS[o.sort].toLowerCase());
  return parts.join(' · ');
}
function checkList(group, values, selected, labelFn){
  return values.map(v => `<label class="check"><input type="checkbox" data-g="${group}" value="${esc(v)}" ${selected.includes(v) ? 'checked' : ''}> <span>${esc(labelFn ? labelFn(v) : v)}</span></label>`).join('');
}

  const form = $('#repForm');
  form.addEventListener('submit', e => e.preventDefault());

  const read = () => {

    o.noFrom = $('#r-from').value.trim(); o.noTo = $('#r-to').value.trim(); o.q = $('#r-q').value;

  form.addEventListener('change', read);

function updateReportPreview(){

app.addEventListener('click', async e => {

  else if(act === 'new') go('new');
  else if(act === 'openwalk'){ S.walk = S.walks.find(w => w.id === b.dataset.id); S.filter='all'; S.loc='all'; S.q=''; S.scroll=0; go('walk'); wake(); }
  else if(act === 'backwalk') go('walk', {keepScroll:true});
  else if(act === 'edit') go('edit');
  else if(act === 'report') go('report');
  else if(act === 'additem') go('additem');
  else if(act === 'filter'){ S.filter = b.dataset.f; refreshCounts(); renderList(); }
  else if(act === 'st'){
    const row = b.closest('.row'); const it = setStatus(row.dataset.id, b.dataset.st);
    if(it){ row.outerHTML = rowHTML(it); refreshCounts(); }
  }
  else if(act === 'item'){ S.itemId = b.dataset.id; go('item'); }
  else if(act === 'goitem'){ if(b.dataset.id){ S.itemId = b.dataset.id; go('item'); } }
  else if(act === 'bst'){
    const it = setStatus(S.itemId, b.dataset.st);
    if(it){ document.querySelectorAll('.bigseg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.st === it.status)));
      const fa = $('#i-fa'); fa.disabled = it.status !== 'complete'; fa.checked = !!it.fa; }
  }
  else if(act === 'annotate'){ const p = await DB.get('photos', b.dataset.pid); if(p) openAnnotator(p); }
  else if(act === 'delphoto'){
    const pid = b.dataset.pid; const it = S.walk.items.find(x => x.id === S.itemId);
    if(S.delArm !== pid){ S.delArm = pid; renderPhotos(it); return; }
    it.photos = it.photos.filter(x => x !== pid); S.delArm = null;
    await DB.del('photos', pid); saveWalk(true);
    rerenderItem();
    toast('Photo deleted');
  }
  else if(act === 'delitem'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.querySelector('span').textContent = 'Tap again to remove'; return; }
    const it = S.walk.items.find(x => x.id === S.itemId);
    for(const pid of it.photos) await DB.del('photos', pid);
    S.walk.items = S.walk.items.filter(x => x.id !== S.itemId); saveWalk(true); go('walk',{keepScroll:true}); toast('Item removed');
  }
  else if(act === 'delwalk'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.querySelector('span').textContent = 'Tap again to delete walk and photos'; return; }
    const w = S.walk;
    for(const it of w.items) for(const pid of it.photos) await DB.del('photos', pid);
    await DB.del('walks', w.id); S.walk = null; await loadWalks(); go('home'); toast('Walk deleted');
  }
  else if(act === 'applyupdate'){ await flush(); if(S.updateReady) S.updateReady.postMessage('SKIP_WAITING'); }
  else if(act === 'teamtpl'){
    if(!navigator.onLine){ toast('Connect to signal to load the team checklist.'); return; }
    const pass = await DB.get('meta', 'pass');
    if(pass) await syncTeamTemplate(pass); else { S.needPass = true; S.passMsg = 'Enter the team passcode to switch back to the team checklist.'; renderHome(); }
  }
  else if(act === 'pdf') makePDF(b);
  else if(act === 'xlsx') makeXLSX(b);
  else if(act === 'allphotos') exportPhotos(S.walk.items, b, $('#repMsg'));
  else if(act === 'itemphotos') exportPhotos(S.walk.items.filter(x => x.id === S.itemId), b, null);
});

    }

    const files = [...(e.target.files || [])]; e.target.value = '';
    if(!files.length) return;
    const it = S.walk.items.find(x => x.id === S.itemId);
    toast(files.length > 1 ? `Adding ${files.length} photos…` : 'Adding photo…');
    let added = null;

      try{
        const p = await processPhoto(f); p.walkId = S.walk.id; p.itemId = it.id;

  }
});

/* ---------- photos ---------- */
function loadImage(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
async function processPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const im = await loadImage(url);
    const max = 1600; const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * sc), h = Math.round(im.naturalHeight * sc);

/* ---------- annotator ---------- */
const COLORS = [['#ff2d2d','Red'],['#ffd400','Yellow'],['#ffffff','White'],['#1e90ff','Blue']];
const TEXT_FONT = '"Barlow", "Helvetica Neue", Arial, sans-serif';
const TEXT_LH = 1.18;
function textRect(s){ return { x:Math.min(s.a[0], s.b[0]), y:Math.min(s.a[1], s.b[1]), w:Math.abs(s.b[0]-s.a[0]), h:Math.abs(s.b[1]-s.a[1]) }; }
function wrapLines(ctx, text, maxW){
  const out = [];
  String(text).split('\n').forEach(para => {
    const words = para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(''); return; }
    let line = '';
    for(let word of words){
      while(ctx.measureText(word).width > maxW && word.length > 1){
        let k = word.length - 1;
        while(k > 1 && ctx.measureText(word.slice(0, k)).width > maxW) k--;
        if(line){ out.push(line); line = ''; }
        out.push(word.slice(0, k)); word = word.slice(k);
      }
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width <= maxW) line = test;
      else { if(line) out.push(line); line = word; }
    }
    out.push(line);
  });
  return out;
}
/* Largest font size whose wrapped lines fit the box. More text -> smaller size. */
function fitText(ctx, text, w, h, maxSize, minSize){
  let lo = minSize, hi = Math.max(minSize, Math.floor(maxSize)), best = null;
  while(lo <= hi){
    const mid = Math.floor((lo + hi) / 2);
    ctx.font = `600 ${mid}px ${TEXT_FONT}`;
    const lines = wrapLines(ctx, text || ' ', w);
    if(lines.length * mid * TEXT_LH <= h){ best = { size:mid, lines }; lo = mid + 1; } else hi = mid - 1;
  }
  if(!best){ ctx.font = `600 ${minSize}px ${TEXT_FONT}`; best = { size:minSize, lines:wrapLines(ctx, text || ' ', w) }; }
  return best;
}

  function layoutTA(){

    else if(b.dataset.a === 'clear'){ shapes = []; draw(); }

const MIME = { pdf:'application/pdf', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', zip:'application/zip', jpg:'image/jpeg', json:'application/json' };
function showFileReady(filename, data, note){
  const ext = filename.split('.').pop().toLowerCase();
  const blob = data instanceof Blob && data.type ? data : new Blob([data], { type: MIME[ext] || 'application/octet-stream' });
  const file = new File([blob], filename, { type: blob.type });
  let canShare = false;
  try{ canShare = !!(navigator.canShare && navigator.canShare({ files:[file] })); }catch(e){}
  const root = $('#sheetRoot');
  const kb = blob.size > 1048576 ? (blob.size/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(blob.size/1024)) + ' KB';
  root.innerHTML = `<div class="sheet-back" data-s="close"><div class="sheet" role="dialog" aria-label="File ready">
    <div class="eyebrow">File ready</div>
    <div class="fname">${esc(filename)} <span class="muted mono">${kb}</span></div>
    <div class="note">${esc(note || (canShare ? 'Share opens your phone\'s share options: pick Mail to email it, or Dropbox, Files or OneDrive to save it.' : 'Save it to this device, then attach it to an email or upload it.'))}</div>
    ${canShare ? `<button class="btn primary block" data-s="share">${I.share}<span>Share</span></button>` : ''}
    <button class="btn block ${canShare ? '' : 'primary'}" data-s="save">${I.file}<span>Save to this device</span></button>
    <button class="btn block" data-s="close">Close</button>
  </div></div>`;
  const close = () => { root.innerHTML = ''; root.onclick = null; };
  root.onclick = async e => {
    const b = e.target.closest('[data-s]'); if(!b) return;
    if(b.classList.contains('sheet-back') && e.target !== b) return;
    const a = b.dataset.s;
    if(a === 'close') close();
    else if(a === 'share'){
      try{ await navigator.share({ files:[file], title: filename }); close(); }
      catch(err){ if(err && err.name !== 'AbortError') toast('Sharing failed. Use Save to this device instead.'); }
    } else if(a === 'save'){
      const url = URL.createObjectURL(blob); const link = document.createElement('a');
      link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000); toast('Saved'); close();
    }
  };
}
async function saveFile(filename, data, msgEl){
  showFileReady(filename, data);
  if(msgEl) msgEl.textContent = `${filename} is ready.`;
  return true;
}
const safeName = s => String(s || 'Stand').replace(/[\\/:*?"<>|]+/g, '-').trim();
function dataURLBytes(u){ const b = atob(u.slice(u.indexOf(',') + 1)); const a = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function exportPhotos(items, btn, msgEl){
  const out = msgEl || { set textContent(v){ toast(v); } };
  const w = S.walk;
  const list = [];
  for(const loc of w.locations) for(const it of items.filter(x => x.location === loc)){
    const recs = (await Promise.all(it.photos.map(id => DB.get('photos', id)))).filter(Boolean);
    const base = safeName(`#${it.no || '-'} ${it.item}`).slice(0, 60).trim();
    recs.forEach((p, i) => {
      const n = recs.length > 1 ? ` (${i + 1})` : '';
      if(p.ann){ list.push({ name: `${safeName(loc)}/${base}${n} - marked up.jpg`, url: p.ann }); list.push({ name: `${safeName(loc)}/${base}${n} - original.jpg`, url: p.src }); }
      else list.push({ name: `${safeName(loc)}/${base}${n}.jpg`, url: p.src });
    });
  }
  if(!list.length){ out.textContent = 'No photos to export.'; return; }
  btn.disabled = true;
  try{
    const prefix = `${safeName(w.stand)} - ${w.date}`;
    if(list.length === 1){
      await saveFile(`${prefix} - ${list[0].name.split('/').pop()}`, new Blob([dataURLBytes(list[0].url)]), msgEl);
    } else {
      if(!window.JSZip){ out.textContent = 'The zip builder did not load. Check the connection and reopen the page.'; return; }
      out.textContent = `Packing ${list.length} photos…`;
      const zip = new window.JSZip(); const root = zip.folder(`${prefix} punch photos`);
      list.forEach(f => root.file(f.name, dataURLBytes(f.url), { binary:true }));
      const blob = await zip.generateAsync({ type:'blob', compression:'STORE' });
      const scope = items.length === 1 ? ` - item ${safeName(items[0].no || '')}` : '';
      await saveFile(`${prefix}${scope} - photos.zip`, blob, msgEl);
    }
  }catch(err){ out.textContent = 'Could not export the photos.'; }
  finally{ btn.disabled = false; }
}

async function makePDF(btn){
  const msg = $('#repMsg');
  if(!window.jspdf){ msg.textContent = 'The PDF builder did not load. Check the connection and reopen the app.'; return; }
  const w = S.walk, o = repOpts(), items = reportItems(w, o);
  if(!items.length){ msg.textContent = 'No items match these filters.'; return; }
  btn.disabled = true; msg.textContent = 'Building PDF…';

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'letter' });
    const W = 612, H = 792, M = 40, CW = W - 2*M;
    let y = M;
    const ink = [21,33,43], muted = [91,104,114], line = [211,218,222];

      const lines = doc.splitTextToSize(String(s ?? ''), maxW || CW); const lh = size * 1.25;

    };
    const rule = () => { doc.setDrawColor(...line); doc.setLineWidth(0.8); doc.line(M, y, W - M, y); y += 10; };

    // Header

    text(w.stand || 'Untitled stand', M, 22, 'bold');
    if(w.address) text(w.address, M, 11, 'normal', muted);
    y += 6;
    const meta = [['Walk date', fmtDate(w.date)], ['General contractor', w.gc], ['Walked by', w.by], ['Attendees', w.attendees], ['Report generated', new Date().toLocaleString()], ['Report filters', describeFilters(o)]].filter(r => r[1]);
    meta.forEach(([k,v]) => {

      const lines = doc.splitTextToSize(String(v), CW - 130);
      ensure(lines.length * 13 + 2);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...muted); doc.text(k.toUpperCase(), M, y + 9.5);
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);

    let lastGroup;
    for(const it of items){
      const g = groupOf(o, it);
      if(g !== null && g !== lastGroup){ ensure(44); y += 6; text(g.toUpperCase(), M, 10, 'bold', muted); lastGroup = g; }
      const k = stKey(it);
      ensure(40);
      const top = y;
      text(`#${it.no || '—'}   ${it.item}`, M + 10, 11, 'bold', ink, CW - 10);
      const metaLine = [ST_LABEL[k] + (it.fa ? ', final approval given' : ''), 'Responsible: ' + respOf(it), o.sort === 'location' ? null : it.location, 'Division: ' + (it.division || '—')].filter(Boolean).join('   ·   ');
      text(metaLine, M + 10, 9.5, 'normal', k === 'open' ? SC.open : muted, CW - 10);
      if(y > top) { doc.setFillColor(...SC[k]); doc.rect(M, top + 2, 3, Math.min(y - top, 40) - 2, 'F'); }
      if((it.notes || '').trim()) text(it.notes, M + 10, 10.5, 'normal', ink, CW - 10);
      if(o.photos && it.photos.length){
        const recs = (await Promise.all(it.photos.map(id => DB.get('photos', id)))).filter(Boolean);
        const colW = (CW - 10 - 10) / 2, maxH = 200;
        y += 4;
        for(let i = 0; i < recs.length; i += 2){
          const pair = recs.slice(i, i+2).map(p => { const s = Math.min(colW / p.w, maxH / p.h); return { p, w:p.w*s, h:p.h*s }; });
          const rh = Math.max(...pair.map(q => q.h));
          ensure(rh + 8);
          pair.forEach((q, j) => doc.addImage(q.p.ann || q.p.src, 'JPEG', M + 10 + j*(colW + 10), y, q.w, q.h, undefined, 'FAST'));
          y += rh + 8;
        }
      }
      y += 8;
    }

    const pages = doc.getNumberOfPages();
    for(let i = 1; i <= pages; i++){
      doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...muted);
      doc.text(`${w.stand || ''}  ·  Punch walk ${fmtDate(w.date)}`, M, H - 22);
      doc.text(`Page ${i} of ${pages}`, W - M, H - 22, { align:'right' });
    }
    const scope = reportScopeName(o);
    await saveFile(`Punch Walk - ${safeName(w.stand)} - ${w.date}${scope}.pdf`, doc.output('blob'), msg);
  }catch(err){ msg.textContent = 'Could not build the PDF. ' + (err && err.message ? err.message : ''); }
  btn.disabled = false;
}
function reportScopeName(o){
  const sts = Object.keys(ST_LABEL).filter(k => o.st[k]);
  let s = '';
  if(sts.length === 2 && o.st.open && o.st.todo) s = ' - Open items';
  else if(sts.length === 1) s = ' - ' + ST_LABEL[sts[0]];
  if(o.resp.length === 1) s += ' - ' + safeName(o.resp[0]);
  return s;
}

async function makeXLSX(btn){
  const msg = $('#repMsg');
  if(!window.XLSX){ msg.textContent = 'The Excel writer did not load.'; return; }
  const w = S.walk, o = repOpts(), items = reportItems(w, o);
  if(!items.length){ msg.textContent = 'No items match these filters.'; return; }
  btn.disabled = true;
  try{
    const rows = [
      ['Punch Walk', w.stand || ''], ['Address', w.address || ''], ['Walk date', w.date || ''], ['General contractor', w.gc || ''], ['Walked by', w.by || ''], ['Attendees', w.attendees || ''], ['Report filters', describeFilters(o)], [],
      ['NO','Item','Division','Location','Resp.','Status','Complete','Not Complete','Non Applicable','Final Approval','Notes','Photos']
    ];
    items.forEach(i => rows.push([
      i.no, i.item, i.division, i.location, i.resp, ST_LABEL[stKey(i)], i.status === 'complete' ? 'x' : '', i.status === 'open' ? 'x' : '', i.status === 'na' ? 'x' : '', i.fa ? 'x' : '', i.notes || '', i.photos.length || ''
    ]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:6},{wch:60},{wch:14},{wch:22},{wch:16},{wch:13},{wch:10},{wch:13},{wch:15},{wch:14},{wch:50},{wch:8}];
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{ r:8, c:0 }, e:{ r:8 + items.length, c:11 } }) };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Punch Walk');
    const out = XLSX.write(wb, { type:'array', bookType:'xlsx' });
    await saveFile(`Punch Walk - ${safeName(w.stand)} - ${w.date}${reportScopeName(o)}.xlsx`, new Blob([out]), msg);
  }catch(err){ msg.textContent = 'Could not build the Excel file.'; }
  btn.disabled = false;
}

/* ---------- misc ---------- */
let lock = null;
async function wake(){ try{ if('wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } }catch(e){ lock = null; } }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.walk) wake(); });

async function loadWalks(){ S.walks = (await DB.all('walks')) || []; }
async function init(){
  renderHome();
  await DB.open();
  S.template = (await DB.get('meta', 'template')) || null;
  await loadWalks();
  renderHome();
  await syncTeamTemplate();
  if(S.view === 'home') renderHome();
  registerSW();
}
function registerSW(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const flag = w => { S.updateReady = w; if(S.view === 'home') renderHome(); };
    if(reg.waiting && navigator.serviceWorker.controller) flag(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if(!nw) return;
      nw.addEventListener('statechange', () => { if(nw.state === 'installed' && navigator.serviceWorker.controller) flag(nw); });
    });
    setInterval(() => { if(navigator.onLine) reg.update().catch(() => {}); }, 3600000);
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; flush().then(() => location.reload()); });
}
/* ---- team template: encrypted file in the repo, unlocked with a passcode ---- */
const b64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptTemplate(t, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const key = await deriveKey(pass, salt, iter);
  const clean = Object.assign({}, t); delete clean.local; clean.loaded = Date.now();
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(clean))));
  return { format:'punch-walk-template', v:1, kdf:'PBKDF2-SHA256', iter, cipher:'AES-256-GCM', updated: clean.loaded, salt:b64(salt), iv:b64(iv), data:b64(ct) };
}
async function decryptTemplate(enc, pass){
  const key = await deriveKey(pass, unb64(enc.salt), enc.iter);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(enc.iv) }, key, unb64(enc.data));
  const t = JSON.parse(new TextDecoder().decode(pt));
  if(!t || !Array.isArray(t.items) || !t.items.length) throw new Error('empty');
  t.encUpdated = enc.updated; return t;
}
async function fetchEnc(){
  const r = await fetch('template.enc.json', { cache:'no-store' });
  if(!r.ok) throw new Error('missing');
  return r.json();
}
async function syncTeamTemplate(passTry){
  const pass = passTry || await DB.get('meta', 'pass');
  if(!pass){ if(!S.template){ S.needPass = true; } return; }
  let enc;
  try{ enc = await fetchEnc(); }catch(e){ if(passTry){ toast('Could not reach the checklist file. Connect to signal and try again.'); } return; }
  if(!passTry && S.template && !S.template.local && S.template.encUpdated === enc.updated) return;
  if(!passTry && S.template && S.template.local) return;
  try{
    const t = await decryptTemplate(enc, pass);
    S.template = t; S.needPass = false; S.passMsg = '';
    await DB.put('meta', 'template', t); await DB.put('meta', 'pass', pass);
    if(passTry) toast(`Checklist loaded: ${t.items.length} items`); else if(S.view === 'home') toast('Team checklist updated');
  }catch(e){
    if(passTry){ toast('That passcode did not work.'); }
    else { S.needPass = true; S.passMsg = 'The team checklist was updated with a new passcode. Enter it to get the latest list. You can keep using the current list until then.'; }
  }
  if(S.view === 'home') renderHome();
}
window.addEventListener('online', () => { S.online = true; syncTeamTemplate().then(() => { if(S.view === 'home') renderHome(); }); });
window.addEventListener('offline', () => { S.online = false; if(S.view === 'home') renderHome(); toast('No signal. Your work is still saving on this phone.'); });
init();
})();
